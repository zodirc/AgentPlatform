<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>部署看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sans: "Sora", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --radius: 10px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      --grid-a: rgba(255,255,255,0.035);
      --header-bg: color-mix(in srgb, var(--ink) 78%, transparent);
      --left-bg: color-mix(in srgb, var(--ink-2) 88%, transparent);
      --job-bg: rgba(0, 0, 0, 0.22);
      --log-bg: linear-gradient(180deg, rgba(8, 14, 26, 0.9), rgba(10, 16, 28, 0.95));
      --code-bg: color-mix(in srgb, var(--accent) 12%, transparent);
      --glow-2: rgba(70, 110, 200, 0.12);
      /* default = teal 墨青 */
      --ink: #0b1220;
      --ink-2: #101a2b;
      --panel: #152033;
      --panel-2: #1a2740;
      --line: #2a3a55;
      --line-soft: #22314a;
      --text: #e8eef8;
      --muted: #8b9bb8;
      --accent: #3ecfbf;
      --ok: #3ecf8e;
      --ok-bg: #0f2a22;
      --ok-ring: rgba(62, 207, 142, 0.12);
      --warn: #e0b35c;
      --warn-bg: #2a2212;
      --warn-ring: rgba(224, 179, 92, 0.12);
      --bad: #e06b6b;
      --glow: rgba(62, 207, 191, 0.14);
      --act-border: #2f8a78;
      --act-grad: linear-gradient(180deg, #45d4c3, #2aa89a);
      --act-fg: #04221e;
      --pull-border: #3d6a78;
      --pull-grad: linear-gradient(180deg, #1e3348, #172636);
    }
    html[data-theme="slate"] {
      --ink: #0e1116; --ink-2: #141820; --panel: #1b212b; --panel-2: #222933;
      --line: #343c4a; --line-soft: #2a3140; --text: #e9edf4; --muted: #93a0b5;
      --accent: #7aa2ff; --ok: #6ecf9a; --ok-bg: #143024; --ok-ring: rgba(110, 207, 154, 0.14);
      --warn: #d6b06a; --warn-bg: #2a2314; --warn-ring: rgba(214, 176, 106, 0.14);
      --bad: #e07a7a; --glow: rgba(122, 162, 255, 0.14); --glow-2: rgba(90, 120, 180, 0.1);
      --act-border: #4a6fb0; --act-grad: linear-gradient(180deg, #8ab0ff, #5b84e0); --act-fg: #0a1428;
      --pull-border: #455872; --pull-grad: linear-gradient(180deg, #243044, #1a2434);
    }
    html[data-theme="forest"] {
      --ink: #0a140f; --ink-2: #101c15; --panel: #16251c; --panel-2: #1c2e23;
      --line: #2c4336; --line-soft: #24382d; --text: #e6f2ea; --muted: #8eaa98;
      --accent: #6fdb8c; --ok: #5fd68a; --ok-bg: #123020; --ok-ring: rgba(95, 214, 138, 0.14);
      --warn: #d4b45c; --warn-bg: #2a2412; --warn-ring: rgba(212, 180, 92, 0.14);
      --bad: #e07878; --glow: rgba(111, 219, 140, 0.14); --glow-2: rgba(60, 140, 90, 0.12);
      --act-border: #3f9a5c; --act-grad: linear-gradient(180deg, #7ee29a, #3fad66); --act-fg: #062012;
      --pull-border: #3d6a4e; --pull-grad: linear-gradient(180deg, #1e3a2a, #16281e);
    }
    html[data-theme="ember"] {
      --ink: #140e0c; --ink-2: #1c1410; --panel: #261a15; --panel-2: #2e2019;
      --line: #4a342a; --line-soft: #3a2a22; --text: #f3ebe4; --muted: #b39a8c;
      --accent: #f0a46a; --ok: #7dcf8a; --ok-bg: #16301c; --ok-ring: rgba(125, 207, 138, 0.14);
      --warn: #e0b35c; --warn-bg: #2a2212; --warn-ring: rgba(224, 179, 92, 0.14);
      --bad: #e06b6b; --glow: rgba(240, 164, 106, 0.16); --glow-2: rgba(180, 80, 50, 0.12);
      --act-border: #c47a3d; --act-grad: linear-gradient(180deg, #f2b07a, #d48645); --act-fg: #2a1408;
      --pull-border: #7a5340; --pull-grad: linear-gradient(180deg, #3a241c, #2a1a14);
    }
    html[data-theme="sand"] {
      --ink: #f3efe6; --ink-2: #ebe5d8; --panel: #fffdf8; --panel-2: #f7f1e6;
      --line: #d7cebc; --line-soft: #e2d8c6; --text: #1f2430; --muted: #667085;
      --accent: #0f7a6c; --ok: #1f8a5b; --ok-bg: #e5f5ec; --ok-ring: rgba(31, 138, 91, 0.12);
      --warn: #9a6b12; --warn-bg: #f7edd4; --warn-ring: rgba(154, 107, 18, 0.12);
      --bad: #c04545; --glow: rgba(15, 122, 108, 0.12); --glow-2: rgba(180, 140, 80, 0.1);
      --grid-a: rgba(30, 40, 50, 0.04);
      --header-bg: color-mix(in srgb, #fffdf8 82%, transparent);
      --left-bg: color-mix(in srgb, #f3efe6 90%, transparent);
      --job-bg: rgba(255, 255, 255, 0.55);
      --log-bg: linear-gradient(180deg, #faf7f0, #f3eee4);
      --code-bg: rgba(15, 122, 108, 0.1);
      --shadow: 0 12px 36px rgba(40, 30, 10, 0.08);
      --act-border: #0f7a6c; --act-grad: linear-gradient(180deg, #1aa090, #0f7a6c); --act-fg: #f5fffc;
      --pull-border: #c4b79f; --pull-grad: linear-gradient(180deg, #fff, #f3eee4);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 480px at 8% -8%, var(--glow), transparent 55%),
        radial-gradient(700px 420px at 100% 0%, var(--glow-2), transparent 50%),
        linear-gradient(180deg, var(--ink-2), var(--ink));
      background-attachment: fixed;
      transition: background 0.35s ease, color 0.25s ease;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.9;
      background-image:
        linear-gradient(var(--grid-a) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-a) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 20%, #000 20%, transparent 75%);
    }
    header {
      position: relative;
      padding: 1.15rem 1.5rem;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      backdrop-filter: blur(10px);
      background: var(--header-bg);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .theme-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .theme-wrap label {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .theme-wrap select {
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.55rem;
      cursor: pointer;
      outline: none;
    }
    .theme-wrap select:focus {
      border-color: var(--accent);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .brand-mark {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    header .sub {
      color: var(--muted);
      font-size: 0.82rem;
      max-width: 42rem;
      line-height: 1.45;
    }
    .pill {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .pill.healthy {
      color: var(--ok);
      border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
      box-shadow: 0 0 0 3px var(--ok-ring);
    }
    .pill.action_needed {
      color: var(--warn);
      border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
      box-shadow: 0 0 0 3px var(--warn-ring);
    }
    main {
      position: relative;
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      min-height: calc(100vh - 88px);
      isolation: isolate;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .left { border-right: 0; border-bottom: 1px solid var(--line-soft); max-height: 42vh; overflow: auto; }
    }
    .left {
      border-right: 1px solid var(--line-soft);
      padding: 0.55rem 0.55rem 0.9rem;
      background: var(--left-bg);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      z-index: 0;
      min-width: 0; /* grid: allow clip instead of spilling into detail */
    }
    .tree {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .tree-row {
      display: grid;
      grid-template-columns: 1.1rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      min-height: 1.85rem;
      padding: 0.28rem 0.4rem;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.84rem;
      text-align: left;
      cursor: pointer;
    }
    .tree-row:hover {
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      border-color: var(--line-soft);
    }
    .tree-row.active {
      background: color-mix(in srgb, var(--accent) 12%, var(--panel));
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
    }
    .tree-row.folder {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 0.35rem;
    }
    .tree-row.folder:first-child {
      margin-top: 0.1rem;
    }
    .tree-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.1rem;
      height: 1.1rem;
      color: var(--accent);
      transition: transform 0.12s ease;
      font-size: 0.7rem;
      line-height: 1;
      user-select: none;
    }
    .tree-row.folder.collapsed .tree-chevron {
      transform: rotate(-90deg);
    }
    .tree-row.leaf .tree-chevron {
      visibility: hidden;
    }
    .tree-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-row.leaf {
      padding-left: 0.55rem;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text);
      text-transform: none;
      letter-spacing: -0.01em;
    }
    .tree-row.leaf .tree-name {
      font-family: var(--sans);
    }
    .tree-aside {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
      max-width: 9.5rem;
    }
    .tree-meta {
      font-family: var(--mono);
      font-size: 0.64rem;
      color: var(--muted);
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
    }
    .tree-meta.warn { color: var(--warn); }
    .tree-meta.run { color: var(--accent); }
    .tree-children {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      margin: 0.05rem 0 0.15rem 0.55rem;
      padding-left: 0.45rem;
      border-left: 1px solid var(--line-soft);
    }
    .tree-folder.collapsed > .tree-children {
      display: none;
    }
    .tree-children .tree-folder > .tree-row.folder {
      margin-top: 0.15rem;
      font-size: 0.7rem;
    }
    .tree-children .tree-children {
      margin-left: 0.35rem;
    }
    .right {
      padding: 1.15rem 1.4rem 2rem;
      position: relative;
      z-index: 1;
      background: var(--bg);
      min-width: 0;
    }
    .tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      padding: 0.14rem 0.38rem;
      border-radius: 5px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .tag.ok { color: var(--ok); background: var(--ok-bg); }
    .tag.action { color: var(--warn); background: var(--warn-bg); }
    .tag.running { color: #0b6e4f; background: color-mix(in srgb, #0b6e4f 16%, transparent); }
    .tag.skip { color: var(--muted); background: color-mix(in srgb, var(--muted) 18%, transparent); }
    .tag.unknown { color: var(--muted); background: color-mix(in srgb, var(--panel) 70%, var(--ink)); }
    button.act {
      font-family: var(--sans);
      font-size: 0.74rem;
      padding: 0.38rem 0.6rem;
      border-radius: 7px;
      border: 1px solid var(--act-border);
      background: var(--act-grad);
      color: var(--act-fg);
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: filter 0.15s ease;
    }
    button.act:hover:not(:disabled) { filter: brightness(1.06); }
    button.act:disabled { opacity: 0.4; cursor: not-allowed; }
    .tree-aside button.act {
      font-size: 0.66rem;
      padding: 0.18rem 0.4rem;
      border-radius: 5px;
    }
    .panel-title {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.1rem 0 0.65rem;
    }
    .detail-card {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 1.05rem 1.1rem;
      background: linear-gradient(165deg, var(--panel), var(--panel-2));
      box-shadow: var(--shadow);
      animation: rise 0.28s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .detail-card h3 {
      margin: 0 0 0.55rem;
      font-size: 1.08rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .detail-card .line {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
      margin: 0.4rem 0;
    }
    .detail-card code, .hint code {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      background: var(--code-bg);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }
    .job {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
      line-height: 1.45;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: var(--job-bg);
      border: 1px solid var(--line-soft);
    }
    .queue {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--text);
      margin-bottom: 0.7rem;
      line-height: 1.5;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent) 8%, var(--job-bg));
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line-soft));
    }
    .queue .q-label {
      color: var(--muted);
      margin-right: 0.35rem;
    }
    .err {
      color: var(--bad);
      font-size: 0.84rem;
      min-height: 1.15em;
      margin-bottom: 0.35rem;
    }
    pre.log {
      margin: 0;
      max-height: 42vh;
      overflow: auto;
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.45;
      white-space: pre-wrap;
      color: var(--text);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      background: var(--log-bg);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 6%, transparent);
    }
    .hint {
      color: var(--muted);
      font-size: 0.76rem;
      margin-top: 0.8rem;
      line-height: 1.45;
    }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
    .log-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0;
      flex: 1;
    }
    .log-tabs button {
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.32rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--line-soft);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .log-tabs button:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .log-tabs button.on {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .log-tabs button.has { color: var(--text); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: hidden;
      background: var(--job-bg);
    }
    .seg button {
      font-size: 0.74rem;
      padding: 0.4rem 0.75rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .seg button.on {
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
    }
    button.pull {
      font-family: var(--sans);
      font-size: 0.74rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--pull-border);
      background: var(--pull-grad);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    button.pull:hover:not(:disabled) {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    button.pull:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    button.danger {
      font-family: var(--sans);
      font-size: 0.74rem;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line));
      background: color-mix(in srgb, var(--bad) 12%, var(--panel));
      color: var(--bad);
      cursor: pointer;
      font-weight: 600;
    }
    button.danger:hover:not(:disabled) {
      border-color: var(--bad);
      background: color-mix(in srgb, var(--bad) 20%, var(--panel));
    }
    button.danger:disabled { opacity: 0.45; cursor: not-allowed; }
    button.clear-log {
      font-family: var(--sans);
      font-size: 0.74rem;
      padding: 0.35rem 0.7rem;
      border-radius: 7px;
      border: 1px solid var(--line-soft);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    button.clear-log:hover { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
    button.clear-log:disabled { opacity: 0.4; cursor: not-allowed; }
    .remote-hint { font-size: 0.74rem; color: var(--muted); }
    .remote-hint.warn { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">Release Console</div>
      <h1>部署看板</h1>
      <div class="sub">本机边改边试（含未提交）· 换机器先拉取再按已提交部署</div>
    </div>
    <div class="header-right">
      <div class="theme-wrap">
        <label for="theme-sel">主题</label>
        <select id="theme-sel" title="切换外观主题">
          <option value="teal">墨青</option>
          <option value="slate">岩灰</option>
          <option value="forest">林深</option>
          <option value="ember">余烬</option>
          <option value="sand">浅沙</option>
        </select>
      </div>
      <div id="pill" class="pill">…</div>
    </div>
  </header>
  <main>
    <aside class="left" id="list"></aside>
    <section class="right">
      <div class="toolbar">
        <div class="seg" id="mode-seg" title="检测范围">
          <button type="button" data-mode="local" class="on">本地开发</button>
          <button type="button" data-mode="sync">同步部署</button>
        </div>
        <button type="button" class="pull" id="btn-pull" title="git fetch + pull --ff-only">拉取远程</button>
        <button type="button" class="pull" id="btn-rebuild-all" title="强制重建 api/runtime/ast-indexer/web/gateway">全部重建</button>
        <button type="button" class="pull" id="btn-restart" title="重启看板进程以加载最新代码（产品容器不受影响）">重启看板</button>
        <button type="button" class="danger" id="btn-cancel" title="取消进行中的重建/索引任务">取消任务</button>
        <span class="remote-hint" id="remote-hint"></span>
      </div>
      <div class="job" id="job">—</div>
      <div class="queue" id="queue" hidden></div>
      <div class="err" id="err"></div>
      <div id="detail"></div>
      <h2 class="panel-title">各模块任务日志</h2>
      <div class="toolbar" style="margin-bottom:0.55rem">
        <div class="log-tabs" id="log-tabs"></div>
        <button type="button" class="clear-log" id="btn-clear-log" title="清空当前输出栏（不删文件）">清空输出栏</button>
        <span class="remote-hint" id="log-meta-hint"></span>
      </div>
      <pre class="log" id="log">—</pre>
      <p class="hint">日志形如 <code>[2026-08-07 12:00:00]</code>，上新下旧。「清空输出栏」只清显示。产品站：<a href="http://localhost/">http://localhost/</a></p>
    </section>
  </main>
  <script>
    let plan = null;
    let selectedId = null;
    let logModule = localStorage.getItem("releaseLogModule") || "all";
    let logMeta = {};
    let busy = false;
    let lastPlanSig = "";
    let lastLogText = "";
    let hideLogUntilChange = null;
    let staleTimer = null;
    let watchDeploy = false;
    let watchAction = null;
    let watchUntil = 0;
    let watchTimer = null;
    let detectMode = localStorage.getItem("releaseDetectMode") || "local";
    if (detectMode !== "local" && detectMode !== "sync") detectMode = "local";
    const THEMES = ["teal", "slate", "forest", "ember", "sand"];
    let theme = localStorage.getItem("releaseTheme") || "teal";
    if (!THEMES.includes(theme)) theme = "teal";
    const $ = (id) => document.getElementById(id);

    function applyTheme(name) {
      theme = THEMES.includes(name) ? name : "teal";
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("releaseTheme", theme);
      const sel = $("theme-sel");
      if (sel) sel.value = theme;
    }
    applyTheme(theme);

    const LOG_TABS = [
      { id: "all", label: "all" },
      { id: "git", label: "git" },
      { id: "api", label: "api" },
      { id: "runtime", label: "runtime" },
      { id: "ast_indexer", label: "ast_indexer" },
      { id: "web", label: "web" },
      { id: "gateway", label: "gateway" },
      { id: "index_product", label: "产品索引" },
      { id: "index_ops", label: "Ops BEIR" },
      { id: "index_ops_zh", label: "Ops 中文" },
      { id: "ops_bench", label: "Ops Bench" },
      { id: "swe_eval_images", label: "SWE 镜像" },
    ];

    const ITEM_TO_LOG = {
      api: "api",
      runtime: "runtime",
      ast_indexer: "ast_indexer",
      web: "web",
      gateway: "gateway",
      embedding: "runtime",
      ops_embedding_ref: "runtime",
      index_product: "index_product",
      index_ops: "index_ops",
      index_ops_zh: "index_ops_zh",
      ops_bench: "ops_bench",
      swe_eval_images: "swe_eval_images",
    };

    function statusLabel(st) {
      if (st === "ok") return "已是最新";
      if (st === "action") return "存在变动";
      if (st === "running") return "进行中";
      if (st === "skip") return "不适用/可选";
      return st || "?";
    }

    function planSig(p) {
      if (!p) return "";
      const items = (p.items || []).map((i) =>
        [
          i.id,
          i.status,
          i.detail,
          i.deployed_sha,
          i.button && i.button.action,
          i.live && (i.live.summary || ""),
          i.live && i.live.pct,
        ].join("|")
      );
      const dep = (p.deploy && p.deploy.deployed) || {};
      const depSig = Object.keys(dep)
        .sort()
        .map((k) => k + ":" + ((dep[k] && dep[k].git_sha) || "").slice(0, 10))
        .join(",");
      const liveSig = (p.live || [])
        .map((l) => [l.item_id, l.summary, l.pct].join(":"))
        .join(";");
      const qSig = ((p.queue || {}).pending || [])
        .map((i) => [i.id, i.status, i.action].join(":"))
        .join(";");
      return [
        p.summary,
        p.git_sha_short,
        p.stale ? "1" : "0",
        (p.deploy || {}).phase,
        (p.deploy || {}).message,
        (p.deploy || {}).current_module || "",
        depSig,
        liveSig,
        qSig,
        items.join(";"),
      ].join("#");
    }

    function deployPhaseActive(phase) {
      return ["detecting", "building", "switching", "verifying"].includes(phase || "");
    }

    function scheduleWatchRefresh(ms) {
      if (watchTimer) clearTimeout(watchTimer);
      watchTimer = setTimeout(() => refresh(true), ms);
    }

    // 产品 Agent vs Ops 分轨；二级目录像资源管理器。
    const TREE_SPEC = [
      {
        id: "product",
        label: "产品 Agent",
        children: [
          {
            id: "product_code",
            label: "代码",
            match: (it) => it.lane === "product" && it.kind === "code",
          },
          {
            id: "product_retrieval",
            label: "检索",
            match: (it) =>
              it.lane === "product" && (it.kind === "model" || it.kind === "index"),
          },
        ],
      },
      {
        id: "ops",
        label: "Ops",
        children: [
          {
            id: "ops_retrieval",
            label: "检索",
            match: (it) =>
              it.lane === "ops" && (it.kind === "model" || it.kind === "index"),
          },
          {
            id: "ops_eval",
            label: "评测",
            match: (it) => it.lane === "ops" && it.kind === "ops",
          },
        ],
      },
    ];

    // Remember which folders the user opened/closed (true=open).
    let treeOpen = (() => {
      try {
        return JSON.parse(localStorage.getItem("releaseTreeOpen") || "{}") || {};
      } catch {
        return {};
      }
    })();
    let lastEnsuredSelect = null;

    function saveTreeOpen() {
      localStorage.setItem("releaseTreeOpen", JSON.stringify(treeOpen));
    }

    function isFolderOpen(gid) {
      if (Object.prototype.hasOwnProperty.call(treeOpen, gid)) return !!treeOpen[gid];
      // 默认展开产品轨及其代码；Ops 默认收起
      return gid === "product" || gid === "product_code";
    }

    function setFolderOpen(gid, open) {
      treeOpen[gid] = !!open;
      saveTreeOpen();
    }

    function toggleFolder(gid) {
      setFolderOpen(gid, !isFolderOpen(gid));
    }

    function folderPathOfItem(it) {
      for (const root of TREE_SPEC) {
        for (const sub of root.children || []) {
          if (sub.match(it)) return [root.id, sub.id];
        }
        if (typeof root.match === "function" && root.match(it)) return [root.id];
      }
      return [];
    }

    function shortItemTitle(it) {
      return String(it.title || it.id || "");
    }

    function collectMatched(items, node) {
      if (typeof node.match === "function") {
        return items.filter((it) => node.match(it));
      }
      const out = [];
      for (const child of node.children || []) {
        out.push(...collectMatched(items, child));
      }
      return out;
    }

    function groupMeta(items) {
      const n = items.length;
      const run = items.filter((i) => i.status === "running" || i.live || i.queue).length;
      const act = items.filter(
        (i) => i.status === "action" && i.id !== "ops_embedding_ref"
      ).length;
      // ops 向量镜像项：仅当产品向量本身未标 action 时才计入，避免重复角标
      const actMirror = items.filter(
        (i) => i.status === "action" && i.id === "ops_embedding_ref"
      ).length;
      const actShown = act + (act ? 0 : actMirror);
      if (run) return { text: `${run}/${n}`, cls: "run" };
      if (actShown) return { text: `${actShown}/${n}`, cls: "warn" };
      return { text: String(n), cls: "" };
    }

    function selectItem(it) {
      selectedId = it.id;
      for (const gid of folderPathOfItem(it)) setFolderOpen(gid, true);
      lastEnsuredSelect = it.id;
      if (logModule !== "all") {
        logModule = ITEM_TO_LOG[it.id] || it.id;
        localStorage.setItem("releaseLogModule", logModule);
        hideLogUntilChange = null;
        lastLogText = "";
      }
      renderList();
      renderDetail();
      renderLogTabs();
      loadLog();
    }

    function appendLeafRow(box, it) {
      const row = document.createElement("div");
      row.className = "tree-row leaf" + (selectedId === it.id ? " active" : "");
      row.setAttribute("role", "treeitem");
      row.tabIndex = 0;
      const btn = it.button;
      const canAct =
        !!btn && (it.status === "running" || it.status === "action" || it.queue);
      row.innerHTML = `
        <span class="tree-chevron">·</span>
        <span class="tree-name" title="${(it.detail || it.title || "").replace(/"/g, "&quot;")}">${shortItemTitle(it)}</span>
        <span class="tree-aside">
          <span class="tag ${it.status || "unknown"}">${statusLabel(it.status)}</span>
          ${btn && canAct ? `<button class="act" data-action="${btn.action}">${btn.label}</button>` : ""}
        </span>`;
      row.onclick = (e) => {
        if (e.target.closest("button")) return;
        selectItem(it);
      };
      row.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectItem(it);
        }
      };
      const b = row.querySelector("button.act[data-action]");
      if (b && canAct) {
        b.onclick = (ev) => {
          ev.stopPropagation();
          selectItem(it);
          runAction(b.getAttribute("data-action"));
        };
      }
      box.appendChild(row);
    }

    function renderFolderNode(parent, node, items, placed) {
      const matched = collectMatched(items, node);
      if (!matched.length) return;
      matched.forEach((it) => placed.add(it.id));

      const open = isFolderOpen(node.id);
      const meta = groupMeta(matched);
      const folder = document.createElement("div");
      folder.className = "tree-folder" + (open ? "" : " collapsed");
      folder.dataset.group = node.id;

      const head = document.createElement("button");
      head.type = "button";
      head.className = "tree-row folder" + (open ? "" : " collapsed");
      head.setAttribute("aria-expanded", open ? "true" : "false");
      head.innerHTML = `
        <span class="tree-chevron">▾</span>
        <span class="tree-name">${node.label}</span>
        <span class="tree-aside"><span class="tree-meta ${meta.cls}">${meta.text}</span></span>`;
      head.onclick = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        toggleFolder(node.id);
        renderList();
      };

      const children = document.createElement("div");
      children.className = "tree-children";
      children.setAttribute("role", "group");

      if (node.children && node.children.length) {
        for (const child of node.children) {
          renderFolderNode(children, child, items, placed);
        }
      } else {
        for (const it of matched) appendLeafRow(children, it);
      }

      folder.appendChild(head);
      folder.appendChild(children);
      parent.appendChild(folder);
    }

    function renderList() {
      const box = $("list");
      box.innerHTML = "";
      if (!plan) return;

      // 选中项变更时展开路径上的目录（不阻止之后手动收起）
      if (selectedId && selectedId !== lastEnsuredSelect) {
        const it = (plan.items || []).find((x) => x.id === selectedId);
        if (it) {
          for (const gid of folderPathOfItem(it)) setFolderOpen(gid, true);
        }
        lastEnsuredSelect = selectedId;
      }

      const tree = document.createElement("div");
      tree.className = "tree";
      tree.setAttribute("role", "tree");

      const items = plan.items || [];
      const placed = new Set();
      for (const root of TREE_SPEC) {
        renderFolderNode(tree, root, items, placed);
      }
      for (const it of items) {
        if (!placed.has(it.id)) appendLeafRow(tree, it);
      }
      box.appendChild(tree);
    }

    function renderDetail() {
      const it = (plan?.items || []).find((x) => x.id === selectedId) || (plan?.items || [])[0];
      if (it) selectedId = it.id;
      const el = $("detail");
      if (!it) {
        el.innerHTML = "<p class='hint'>暂无检查项</p>";
        return;
      }
      const extra = [];
      if (it.kind === "code") {
        if (it.deployed_sha) {
          const msg = it.deployed_subject ? ` — ${it.deployed_subject}` : "";
          const when = it.deployed_date
            ? ` <span style="opacity:.7">(${it.deployed_date})</span>`
            : "";
          extra.push(`已部署基线（容器按此版本记）：<code>${it.deployed_sha}</code>${msg}${when}`);
        }
        if (plan?.git_sha_short) {
          const hmsg = plan.git_subject ? ` — ${plan.git_subject}` : "";
          extra.push(`仓库 HEAD：<code>${plan.git_sha_short}</code>${hmsg}`);
        }
        if (
          it.status === "ok" &&
          it.deployed_sha &&
          plan?.git_sha_short &&
          !String(plan.git_sha || "").startsWith(it.deployed_sha) &&
          it.deployed_sha !== plan.git_sha_short
        ) {
          extra.push(
            "说明：HEAD 已前进，但<strong>本模块路径无相关变更</strong>，无需重建该服务（改的是发布台/文档等其它目录）。"
          );
        }
        if (plan?.mode === "local") {
          extra.push("模式：本地开发 — 未提交改动也会标「存在变动」，方便先试再 commit。");
        } else {
          extra.push("模式：同步部署 — 只看已提交相对基线的差异；未提交改动忽略。换机器请先拉取。");
        }
      }
      if (it.want) extra.push(`目标模型：<code>${it.want}</code> @ ${it.want_dims}d / INDEX ${it.want_index_version}`);
      if (it.baked) extra.push(`容器 bake：<code>${it.baked}</code>`);
      if (it.stored && (it.stored.embedding_model || it.stored.version)) {
        extra.push(`索引戳记：<code>${it.stored.embedding_model || "?"} / INDEX ${it.stored.version || "?"}</code>`);
      }
      el.innerHTML = `
        <div class="detail-card">
          <h3>${it.title}</h3>
          <div class="line"><span class="tag ${it.status || "unknown"}">${statusLabel(it.status)}</span>${it.detail ? ` · ${it.detail}` : ""}</div>
          ${it.action ? `<div class="line">建议：<code>${it.action}</code></div>` : ""}
          ${extra.map((x) => `<div class="line">${x}</div>`).join("")}
        </div>`;
    }

    function renderLogTabs() {
      const box = $("log-tabs");
      const html = LOG_TABS.map((t) => {
        const meta = logMeta[t.id] || {};
        const cls = (logModule === t.id ? "on" : "") + (meta.has_log ? " has" : "");
        return `<button type="button" data-log="${t.id}" class="${cls}" title="${
          meta.has_log ? t.label + " 有历史输出" : t.label + " 尚无输出"
        }">${t.label}</button>`;
      }).join("");
      if (box.dataset.html === html) return;
      box.dataset.html = html;
      box.innerHTML = html;
      box.onclick = (ev) => {
        const b = ev.target.closest("button[data-log]");
        if (!b) return;
        logModule = b.getAttribute("data-log");
        localStorage.setItem("releaseLogModule", logModule);
        lastLogText = "";
        hideLogUntilChange = null;
        if (logModule !== "all" && logModule !== "git") {
          const match = (plan?.items || []).find((x) => ITEM_TO_LOG[x.id] === logModule);
          if (match) {
            selectedId = match.id;
            renderList();
            renderDetail();
          }
        }
        renderLogTabs();
        loadLog();
        updateClearBtn();
      };
    }

    function updateClearBtn() {
      const btn = $("btn-clear-log");
      if (!btn) return;
      btn.disabled = false;
      const name = logModule || "all";
      btn.textContent = "清空输出栏";
      btn.title = `清空「${name}」输出栏显示（不删除日志文件）`;
    }

    async function loadLogMeta() {
      try {
        const r = await fetch("/api/logs");
        const j = await r.json();
        const next = j.modules || {};
        if (JSON.stringify(next) !== JSON.stringify(logMeta)) {
          logMeta = next;
          renderLogTabs();
        }
        updateClearBtn();
      } catch (_) {
        renderLogTabs();
        updateClearBtn();
      }
    }

    async function loadLog() {
      if (!logModule) return;
      try {
        const lr = await fetch("/api/log?module=" + encodeURIComponent(logModule));
        const lg = await lr.json();
        const empty =
          !lg.text ||
          lg.text.startsWith("（尚无") ||
          lg.text.startsWith("（尚无任何");
        const text = empty
          ? `【${lg.log_key || logModule}】还没有任务输出。\n` +
            `· 拉取远程 → git / all\n` +
            `· 重建/同步 → 对应模块；形如 [日期 时间] 日志`
          : lg.text;
        if (hideLogUntilChange !== null) {
          if (text === hideLogUntilChange) {
            updateClearBtn();
            return;
          }
          hideLogUntilChange = null;
        }
        if (text === lastLogText) return;
        lastLogText = text;
        $("log").textContent = text;
        const hint = $("log-meta-hint");
        if (hint) {
          hint.textContent = lg.newest_ts
            ? `最新一段：${lg.newest_ts} · ${lg.count || 0} 段`
            : "";
        }
        updateClearBtn();
      } catch (e) {
        $("log").textContent = String(e);
      }
    }

    function clearLog() {
      hideLogUntilChange = lastLogText || $("log").textContent || "";
      lastLogText = "";
      $("log").textContent = "";
      const hint = $("log-meta-hint");
      if (hint) hint.textContent = "已清空显示 · 有新输出时再出现";
      updateClearBtn();
    }

    function renderQueue() {
      const el = $("queue");
      if (!el) return;
      const q = plan?.queue || {};
      const pending = q.pending || [];
      if (!pending.length) {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.hidden = false;
      const bits = pending.map((i) => {
        const mark = i.status === "running" ? "▶" : "等待";
        return `${mark} ${i.label || i.action}`;
      });
      el.innerHTML = `<span class="q-label">队列</span>${bits.join(" → ")}`;
    }

    function renderMode() {
      for (const b of $("mode-seg").querySelectorAll("button[data-mode]")) {
        b.classList.toggle("on", b.getAttribute("data-mode") === detectMode);
      }
      const qCount = ((plan?.queue || {}).pending || []).length;
      const hasLive = Array.isArray(plan?.live) && plan.live.length > 0;
      // 串行队列：工具栏始终可入队；取消在有队列或 live 时可用
      $("btn-pull").disabled = false;
      const btnAll = $("btn-rebuild-all");
      const btnRestart = $("btn-restart");
      const btnCancel = $("btn-cancel");
      if (btnAll) btnAll.disabled = false;
      if (btnRestart) btnRestart.disabled = !!window.__restartingConsole;
      if (btnCancel) btnCancel.disabled = !(qCount > 0 || hasLive || busy);
      const rem = plan?.git_remote || {};
      const hint = $("remote-hint");
      hint.textContent = rem.hint || "";
      hint.className = "remote-hint" + (rem.behind > 0 ? " warn" : "");
    }

    function renderHeader() {
      const pill = $("pill");
      const s = plan?.summary || "error";
      pill.className = "pill " + s;
      pill.textContent = s === "healthy" ? "全部最新" : "存在变动";
      const phase = (plan?.deploy || {}).phase || "";
      const hasLive = Array.isArray(plan?.live) && plan.live.length > 0;
      const qCount = ((plan?.queue || {}).pending || []).length;
      const deployLive = hasLive && (plan.live || []).some((l) => l.kind === "deploy" || String(l.action || "").startsWith("up-"));
      busy = deployLive || qCount > 0 || (hasLive && deployPhaseActive(phase));
      renderMode();
      renderQueue();
    }

    function formatFetchErr(e) {
      const raw = String(e && e.message ? e.message : e);
      if (/Failed to fetch|NetworkError|fetch/i.test(raw)) {
        return "连不上看板服务 (:9090)。多半是控制台刚重启或端口瞬断 — 硬刷新本页；若仍失败请确认 release-console 在跑。";
      }
      return raw;
    }

    async function refresh(force) {
      try {
        const q = new URLSearchParams({ mode: detectMode });
        if (force) q.set("force", "1");
        const r = await fetch("/api/plan?" + q.toString());
        if (!r.ok) throw new Error(`plan HTTP ${r.status}`);
        const next = await r.json();
        if (!selectedId && next.items?.length) selectedId = next.items[0].id;
        const sig = planSig(next) + "|" + detectMode;
        const changed = sig !== lastPlanSig;
        plan = next;
        $("err").textContent = "";
        const phase = (plan.deploy || {}).phase || "idle";
        if (changed) {
          lastPlanSig = sig;
          renderHeader();
          renderList();
          renderDetail();
        } else {
          // Always refresh header job line / busy even if item sig stable.
          renderHeader();
        }
        await loadLogMeta();
        await loadLog();
        const scope = plan.detect_scope ? ` · ${plan.detect_scope}` : "";
        const stale = plan.stale ? " · 后台核对中…" : "";
        const headBit = plan.git_sha_short
          ? ` · HEAD ${plan.git_sha_short}${plan.git_subject ? " " + plan.git_subject : ""}`
          : "";
        $("job").textContent =
          `任务 ${(plan.deploy || {}).phase || "idle"}${(plan.deploy || {}).message ? " · " + (plan.deploy || {}).message : ""}${headBit}${scope}${stale}`;
        renderQueue();

        const deploying = deployPhaseActive(phase);
        const hasLive = Array.isArray(plan.live) && plan.live.length > 0;
        const qCount = ((plan.queue || {}).pending || []).length;
        if ((hasLive || qCount > 0) && !watchAction && !watchDeploy) {
          // Background job / queue — keep following without re-click.
          watchAction = "live";
          watchUntil = Date.now() + 6 * 60 * 60 * 1000;
        }
        if (watchDeploy) {
          if (deploying || qCount > 0) {
            scheduleWatchRefresh(2000);
          } else if (["done", "failed", "idle"].includes(phase)) {
            // Deploy settled — one more forced rebuild so rows flip off「存在变动」.
            watchDeploy = false;
            scheduleWatchRefresh(700);
          }
        }

        if (watchAction) {
          if (watchAction === "live") {
            if ((!hasLive && qCount === 0) || Date.now() > watchUntil) {
              watchAction = null;
              if (!force) scheduleWatchRefresh(500);
            } else {
              scheduleWatchRefresh(2000);
            }
          } else {
            const itemId = {
              "sync-sources": "index_product",
              "sync-ops-indexes": "index_ops",
              "sync-ops-cmteb": "index_ops_zh",
              "ensure-ops-cmteb": "index_ops_zh",
              "pull-swe-eval-images": "swe_eval_images",
              "start-bench": "ops_bench",
              "up-bench": "ops_bench",
            }[watchAction];
            const it = itemId
              ? (plan.items || []).find((x) => x.id === itemId)
              : null;
            const stillGoing = !!(it && (it.status === "running" || it.live || it.queue));
            if (stillGoing && Date.now() <= watchUntil) {
              scheduleWatchRefresh(2000);
            } else {
              watchAction = null;
              if (!force) scheduleWatchRefresh(500);
            }
          }
        }

        // Prefer queue summary, then live progress on the job line.
        const qSummary = (plan.queue || {}).summary;
        if (qSummary) {
          $("job").textContent = qSummary + headBit + scope + stale;
        } else if (hasLive) {
          const bits = plan.live.map((l) => l.summary || l.item_id).filter(Boolean);
          if (bits.length) {
            $("job").textContent = bits.join(" ｜ ");
          }
        }

        if (plan.stale && !force && !deploying && !watchDeploy && !watchAction && qCount === 0) {
          if (staleTimer) clearTimeout(staleTimer);
          staleTimer = setTimeout(() => refresh(false), 2200);
        }
      } catch (e) {
        $("err").textContent = formatFetchErr(e);
        // Drop watch locks so a dead console does not freeze the toolbar forever.
        watchDeploy = false;
        watchAction = null;
        busy = false;
        renderMode();
        scheduleWatchRefresh(3000);
      }
    }

    async function runAction(action) {
      $("err").textContent = "";
      const isModuleDeploy = [
        "up-api",
        "up-runtime",
        "up-ast-indexer",
        "up-web",
        "up-gateway",
        "up-all",
        "git-pull",
      ].includes(action);
      if (action === "cancel-jobs") {
        watchDeploy = false;
        watchAction = "live";
        watchUntil = Date.now() + 10 * 60 * 1000;
      } else if (isModuleDeploy) {
        watchDeploy = true;
        watchAction = "live";
        watchUntil = Date.now() + 6 * 60 * 60 * 1000;
      } else {
        watchDeploy = false;
        watchAction = action;
        // SWE eval images ≈1GiB each; n5 can take well over an hour on slow Hub.
        // SWE pull / full up-bench rebuild can take a long time.
        const longPull =
          action === "pull-swe-eval-images" || action === "up-bench";
        watchUntil = Date.now() + (longPull ? 4 : 1) * 60 * 60 * 1000;
      }
      renderList();
      renderMode();
      try {
        const r = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          $("err").textContent = j.error || r.statusText;
          watchDeploy = false;
          watchAction = null;
          renderList();
          renderMode();
          return;
        }
        const attached = !!j.attached;
        const queued = !!j.queued;
        $("job").textContent = j.message || (attached ? `已接上 ${action}` : `已入队 ${action}`);
        if (j.queue) {
          plan = plan || {};
          plan.queue = j.queue;
          renderQueue();
        }
        const key = {
          "up-api": "api",
          "up-runtime": "runtime",
          "up-ast-indexer": "ast_indexer",
          "up-web": "web",
          "up-gateway": "gateway",
          "up-all": "all",
          "cancel-jobs": "all",
          "sync-sources": "index_product",
          "sync-ops-indexes": "index_ops",
          "sync-ops-cmteb": "index_ops_zh",
          "ensure-ops-cmteb": "index_ops_zh",
          "pull-swe-eval-images": "swe_eval_images",
          "start-bench": "ops_bench",
          "up-bench": "ops_bench",
          "git-pull": "all",
        }[action];
        if (key) {
          logModule = key === "all" ? "all" : key;
          localStorage.setItem("releaseLogModule", logModule);
          lastLogText = "";
          hideLogUntilChange = null;
          renderLogTabs();
        }
        if (action === "git-pull") {
          detectMode = "sync";
          localStorage.setItem("releaseDetectMode", detectMode);
          renderMode();
        }
        lastPlanSig = "";
        if (attached || queued) {
          watchUntil = Date.now() + 6 * 60 * 60 * 1000;
          watchAction = watchAction || "live";
        }
        scheduleWatchRefresh(action === "git-pull" ? 2000 : 500);
      } catch (e) {
        $("err").textContent = formatFetchErr(e);
        watchDeploy = false;
        watchAction = null;
        busy = false;
        renderList();
        renderMode();
      }
    }

    $("mode-seg").onclick = (ev) => {
      const b = ev.target.closest("button[data-mode]");
      if (!b) return;
      const m = b.getAttribute("data-mode");
      if (m !== "local" && m !== "sync") return;
      if (m === detectMode) return;
      detectMode = m;
      localStorage.setItem("releaseDetectMode", detectMode);
      lastPlanSig = "";
      renderMode();
      refresh(true);
    };
    $("btn-pull").onclick = () => runAction("git-pull");
    $("btn-rebuild-all").onclick = () => {
      if (!confirm("强制重建 api / runtime / ast-indexer / web / gateway？将进入队列串行执行。")) return;
      runAction("up-all");
    };
    $("btn-restart").onclick = () => restartConsole();
    $("btn-cancel").onclick = () => {
      if (!confirm("将「取消」入队：中止当前任务并清空等待中的队列项。")) return;
      runAction("cancel-jobs");
    };

    async function restartConsole() {
      if (window.__restartingConsole) return;
      if (
        !confirm(
          "重启部署看板进程以加载最新代码？\n进行中的看板任务会中断；api/runtime/web 等产品容器不受影响。"
        )
      ) {
        return;
      }
      window.__restartingConsole = true;
      $("err").textContent = "";
      $("job").textContent = "看板重启中…请稍候";
      renderMode();
      try {
        const r = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "restart-console" }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          $("err").textContent = j.error || r.statusText;
          window.__restartingConsole = false;
          renderMode();
          return;
        }
        $("job").textContent = j.message || "看板即将重启…";
        logModule = "all";
        localStorage.setItem("releaseLogModule", logModule);
        for (let i = 0; i < 40; i++) {
          await new Promise((res) => setTimeout(res, 800));
          try {
            const p = await fetch("/api/plan?mode=" + encodeURIComponent(detectMode), {
              cache: "no-store",
            });
            if (p.ok) {
              location.reload();
              return;
            }
          } catch (_) {
            /* port down during restart — keep polling */
          }
        }
        $("err").textContent =
          "重启超时。请硬刷新本页；若仍失败，在终端执行：bash scripts/release/ensure_console.sh";
        window.__restartingConsole = false;
        renderMode();
      } catch (e) {
        // Request may fail if the process died before the response flushed — still poll.
        $("job").textContent = "看板重启中…正在等待恢复";
        for (let i = 0; i < 40; i++) {
          await new Promise((res) => setTimeout(res, 800));
          try {
            const p = await fetch("/api/plan?mode=" + encodeURIComponent(detectMode), {
              cache: "no-store",
            });
            if (p.ok) {
              location.reload();
              return;
            }
          } catch (_) {}
        }
        $("err").textContent = formatFetchErr(e);
        window.__restartingConsole = false;
        renderMode();
      }
    }
    $("btn-clear-log").onclick = () => clearLog();
    $("theme-sel").onchange = (ev) => applyTheme(ev.target.value);

    renderMode();
    refresh(false);
    setInterval(() => refresh(false), 8000);
  </script>
</body>
</html>
