<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>部署看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b1220;
      --ink-2: #101a2b;
      --panel: #152033;
      --panel-2: #1a2740;
      --line: #2a3a55;
      --line-soft: #22314a;
      --text: #e8eef8;
      --muted: #8b9bb8;
      --accent: #3ecfbf;
      --accent-dim: #1a4f4a;
      --ok: #3ecf8e;
      --ok-bg: #0f2a22;
      --warn: #e0b35c;
      --warn-bg: #2a2212;
      --bad: #e06b6b;
      --glow: rgba(62, 207, 191, 0.14);
      --sans: "Sora", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --radius: 10px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 480px at 8% -8%, var(--glow), transparent 55%),
        radial-gradient(700px 420px at 100% 0%, rgba(70, 110, 200, 0.12), transparent 50%),
        linear-gradient(180deg, var(--ink-2), var(--ink));
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 20%, #000 20%, transparent 75%);
    }
    header {
      position: relative;
      padding: 1.15rem 1.5rem;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      backdrop-filter: blur(10px);
      background: rgba(11, 18, 32, 0.72);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .brand-mark {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    header .sub {
      color: var(--muted);
      font-size: 0.82rem;
      max-width: 42rem;
      line-height: 1.45;
    }
    .pill {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      transition: border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .pill.healthy {
      color: var(--ok);
      border-color: #2f6b54;
      box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.12);
    }
    .pill.action_needed {
      color: var(--warn);
      border-color: #7a6430;
      box-shadow: 0 0 0 3px rgba(224, 179, 92, 0.12);
    }
    main {
      position: relative;
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      min-height: calc(100vh - 88px);
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .left { border-right: 0; border-bottom: 1px solid var(--line-soft); max-height: 42vh; overflow: auto; }
    }
    .left {
      border-right: 1px solid var(--line-soft);
      padding: 0.9rem;
      background: rgba(16, 26, 43, 0.82);
    }
    .right {
      padding: 1.15rem 1.4rem 2rem;
    }
    .mod {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
      align-items: center;
      padding: 0.85rem 0.9rem;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      margin-bottom: 0.55rem;
      background: linear-gradient(160deg, var(--panel), var(--panel-2));
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    .mod:hover {
      border-color: #3d5f72;
      transform: translateY(-1px);
    }
    .mod.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(62, 207, 191, 0.25), var(--shadow);
    }
    .mod .name {
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: -0.01em;
    }
    .mod .why {
      color: var(--muted);
      font-size: 0.74rem;
      margin-top: 0.25rem;
      line-height: 1.4;
    }
    .mod-actions {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      align-items: flex-end;
    }
    .tag {
      font-family: var(--mono);
      font-size: 0.66rem;
      padding: 0.18rem 0.45rem;
      border-radius: 5px;
      letter-spacing: 0.02em;
    }
    .tag.ok { color: var(--ok); background: var(--ok-bg); }
    .tag.action { color: var(--warn); background: var(--warn-bg); }
    .tag.unknown { color: var(--muted); background: #1a2436; }
    button.act {
      font-family: var(--sans);
      font-size: 0.74rem;
      padding: 0.38rem 0.6rem;
      border-radius: 7px;
      border: 1px solid #2f8a78;
      background: linear-gradient(180deg, #45d4c3, #2aa89a);
      color: #04221e;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    button.act:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
    button.act:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .panel-title {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.1rem 0 0.65rem;
    }
    .detail-card {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 1.05rem 1.1rem;
      background: linear-gradient(165deg, rgba(21, 32, 51, 0.95), rgba(16, 26, 43, 0.92));
      box-shadow: var(--shadow);
      animation: rise 0.28s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .detail-card h3 {
      margin: 0 0 0.55rem;
      font-size: 1.08rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .detail-card .line {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
      margin: 0.4rem 0;
    }
    .detail-card code {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      background: rgba(62, 207, 191, 0.08);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }
    .job {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 0.7rem;
      line-height: 1.45;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--line-soft);
    }
    .err {
      color: var(--bad);
      font-size: 0.84rem;
      min-height: 1.15em;
      margin-bottom: 0.35rem;
    }
    pre.log {
      margin: 0;
      max-height: 42vh;
      overflow: auto;
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.45;
      white-space: pre-wrap;
      color: #c9d6ea;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      background:
        linear-gradient(180deg, rgba(8, 14, 26, 0.9), rgba(10, 16, 28, 0.95));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .hint {
      color: var(--muted);
      font-size: 0.76rem;
      margin-top: 0.8rem;
      line-height: 1.45;
    }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
    .log-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0;
      flex: 1;
    }
    .log-tabs button {
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.32rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--line-soft);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .log-tabs button:hover { color: var(--text); border-color: #3d5f72; }
    .log-tabs button.on {
      color: var(--accent);
      border-color: #2f7a72;
      background: rgba(62, 207, 191, 0.1);
    }
    .log-tabs button.has { color: var(--text); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.2);
    }
    .seg button {
      font-size: 0.74rem;
      padding: 0.4rem 0.75rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .seg button.on {
      background: rgba(62, 207, 191, 0.14);
      color: var(--accent);
    }
    button.pull {
      font-family: var(--sans);
      font-size: 0.74rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #3d6a78;
      background: linear-gradient(180deg, #1e3348, #172636);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    button.pull:hover:not(:disabled) {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    button.pull:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    button.clear-log {
      font-family: var(--sans);
      font-size: 0.74rem;
      padding: 0.35rem 0.7rem;
      border-radius: 7px;
      border: 1px solid var(--line-soft);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    button.clear-log:hover { color: var(--bad); border-color: #7a3a3a; }
    button.clear-log:disabled { opacity: 0.4; cursor: not-allowed; }
    .remote-hint { font-size: 0.74rem; color: var(--muted); }
    .remote-hint.warn { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">Release Console</div>
      <h1>部署看板</h1>
      <div class="sub">本机边改边试（含未提交）· 换机器先拉取再按已提交部署</div>
    </div>
    <div id="pill" class="pill">…</div>
  </header>
  <main>
    <aside class="left" id="list"></aside>
    <section class="right">
      <div class="toolbar">
        <div class="seg" id="mode-seg" title="检测范围">
          <button type="button" data-mode="local" class="on">本地开发</button>
          <button type="button" data-mode="sync">同步部署</button>
        </div>
        <button type="button" class="pull" id="btn-pull" title="git fetch + pull --ff-only">拉取远程</button>
        <span class="remote-hint" id="remote-hint"></span>
      </div>
      <div class="job" id="job">—</div>
      <div class="err" id="err"></div>
      <div id="detail"></div>
      <h2 class="panel-title">各模块任务日志</h2>
      <div class="toolbar" style="margin-bottom:0.55rem">
        <div class="log-tabs" id="log-tabs"></div>
        <button type="button" class="clear-log" id="btn-clear-log" title="清空当前输出栏（不删文件）">清空输出栏</button>
        <span class="remote-hint" id="log-meta-hint"></span>
      </div>
      <pre class="log" id="log">—</pre>
      <p class="hint">日志形如 <code>[2026-08-07 12:00:00]</code>，上新下旧。「清空输出栏」只清显示。产品站：<a href="http://localhost/">http://localhost/</a></p>
    </section>
  </main>
  <script>
    let plan = null;
    let selectedId = null;
    let logModule = localStorage.getItem("releaseLogModule") || "all";
    let logMeta = {};
    let busy = false;
    let lastPlanSig = "";
    let lastLogText = "";
    let hideLogUntilChange = null;
    let staleTimer = null;
    let detectMode = localStorage.getItem("releaseDetectMode") || "local";
    if (detectMode !== "local" && detectMode !== "sync") detectMode = "local";
    const $ = (id) => document.getElementById(id);

    const LOG_TABS = [
      { id: "all", label: "all" },
      { id: "git", label: "git" },
      { id: "api", label: "api" },
      { id: "runtime", label: "runtime" },
      { id: "web", label: "web" },
      { id: "gateway", label: "gateway" },
      { id: "index_product", label: "产品索引" },
      { id: "index_ops", label: "Ops 索引" },
    ];

    const ITEM_TO_LOG = {
      api: "api",
      runtime: "runtime",
      web: "web",
      gateway: "gateway",
      embedding: "runtime",
      index_product: "index_product",
      index_ops: "index_ops",
    };

    function statusLabel(st) {
      if (st === "ok") return "已是最新";
      if (st === "action") return "存在变动";
      return st || "?";
    }

    function planSig(p) {
      if (!p) return "";
      const items = (p.items || []).map((i) =>
        [i.id, i.status, i.detail, i.deployed_sha, i.button && i.button.action].join("|")
      );
      return [
        p.summary,
        p.git_sha_short,
        p.stale ? "1" : "0",
        (p.deploy || {}).phase,
        (p.deploy || {}).message,
        items.join(";"),
      ].join("#");
    }

    function renderList() {
      const box = $("list");
      box.innerHTML = "";
      if (!plan) return;
      for (const it of plan.items || []) {
        const row = document.createElement("div");
        row.className = "mod" + (selectedId === it.id ? " active" : "");
        row.onclick = (e) => {
          if (e.target.closest("button")) return;
          selectedId = it.id;
          if (logModule !== "all") {
            logModule = ITEM_TO_LOG[it.id] || it.id;
            localStorage.setItem("releaseLogModule", logModule);
            hideLogUntilChange = null;
            lastLogText = "";
          }
          renderList();
          renderDetail();
          renderLogTabs();
          loadLog();
        };
        const btn = it.button;
        const canAct = it.status === "action" && btn && !busy;
        row.innerHTML = `
          <div>
            <div class="name">${it.title || it.id}</div>
            <div class="why">${it.detail || ""}</div>
          </div>
          <div class="mod-actions">
            <span class="tag ${it.status || "unknown"}">${statusLabel(it.status)}</span>
            ${btn ? `<button class="act" data-action="${btn.action}" ${canAct ? "" : "disabled"}>${btn.label}</button>` : ""}
          </div>`;
        const b = row.querySelector("button.act[data-action]");
        if (b && canAct) {
          b.onclick = (ev) => {
            ev.stopPropagation();
            runAction(b.getAttribute("data-action"));
          };
        }
        box.appendChild(row);
      }
    }

    function renderDetail() {
      const it = (plan?.items || []).find((x) => x.id === selectedId) || (plan?.items || [])[0];
      if (it) selectedId = it.id;
      const el = $("detail");
      if (!it) {
        el.innerHTML = "<p class='hint'>暂无检查项</p>";
        return;
      }
      const extra = [];
      if (it.kind === "code") {
        if (it.deployed_sha) {
          const msg = it.deployed_subject ? ` — ${it.deployed_subject}` : "";
          const when = it.deployed_date
            ? ` <span style="opacity:.7">(${it.deployed_date})</span>`
            : "";
          extra.push(`已部署基线（容器按此版本记）：<code>${it.deployed_sha}</code>${msg}${when}`);
        }
        if (plan?.git_sha_short) {
          const hmsg = plan.git_subject ? ` — ${plan.git_subject}` : "";
          extra.push(`仓库 HEAD：<code>${plan.git_sha_short}</code>${hmsg}`);
        }
        if (
          it.status === "ok" &&
          it.deployed_sha &&
          plan?.git_sha_short &&
          !String(plan.git_sha || "").startsWith(it.deployed_sha) &&
          it.deployed_sha !== plan.git_sha_short
        ) {
          extra.push(
            "说明：HEAD 已前进，但<strong>本模块路径无相关变更</strong>，无需重建该服务（改的是发布台/文档等其它目录）。"
          );
        }
        if (plan?.mode === "local") {
          extra.push("模式：本地开发 — 未提交改动也会标「存在变动」，方便先试再 commit。");
        } else {
          extra.push("模式：同步部署 — 只看已提交相对基线的差异；未提交改动忽略。换机器请先拉取。");
        }
      }
      if (it.want) extra.push(`目标模型：<code>${it.want}</code> @ ${it.want_dims}d / INDEX ${it.want_index_version}`);
      if (it.baked) extra.push(`容器 bake：<code>${it.baked}</code>`);
      if (it.stored && (it.stored.embedding_model || it.stored.version)) {
        extra.push(`索引戳记：<code>${it.stored.embedding_model || "?"} / INDEX ${it.stored.version || "?"}</code>`);
      }
      el.innerHTML = `
        <div class="detail-card">
          <h3>${it.title}</h3>
          <div class="line"><span class="tag ${it.status || "unknown"}">${statusLabel(it.status)}</span>${it.detail ? ` · ${it.detail}` : ""}</div>
          ${it.action ? `<div class="line">建议：<code>${it.action}</code></div>` : ""}
          ${extra.map((x) => `<div class="line">${x}</div>`).join("")}
        </div>`;
    }

    function renderLogTabs() {
      const box = $("log-tabs");
      const html = LOG_TABS.map((t) => {
        const meta = logMeta[t.id] || {};
        const cls = (logModule === t.id ? "on" : "") + (meta.has_log ? " has" : "");
        return `<button type="button" data-log="${t.id}" class="${cls}" title="${
          meta.has_log ? t.label + " 有历史输出" : t.label + " 尚无输出"
        }">${t.label}</button>`;
      }).join("");
      if (box.dataset.html === html) return;
      box.dataset.html = html;
      box.innerHTML = html;
      box.onclick = (ev) => {
        const b = ev.target.closest("button[data-log]");
        if (!b) return;
        logModule = b.getAttribute("data-log");
        localStorage.setItem("releaseLogModule", logModule);
        lastLogText = "";
        hideLogUntilChange = null;
        if (logModule !== "all" && logModule !== "git") {
          const match = (plan?.items || []).find((x) => ITEM_TO_LOG[x.id] === logModule);
          if (match) {
            selectedId = match.id;
            renderList();
            renderDetail();
          }
        }
        renderLogTabs();
        loadLog();
        updateClearBtn();
      };
    }

    function updateClearBtn() {
      const btn = $("btn-clear-log");
      if (!btn) return;
      btn.disabled = false;
      const name = logModule || "all";
      btn.textContent = "清空输出栏";
      btn.title = `清空「${name}」输出栏显示（不删除日志文件）`;
    }

    async function loadLogMeta() {
      try {
        const r = await fetch("/api/logs");
        const j = await r.json();
        const next = j.modules || {};
        if (JSON.stringify(next) !== JSON.stringify(logMeta)) {
          logMeta = next;
          renderLogTabs();
        }
        updateClearBtn();
      } catch (_) {
        renderLogTabs();
        updateClearBtn();
      }
    }

    async function loadLog() {
      if (!logModule) return;
      try {
        const lr = await fetch("/api/log?module=" + encodeURIComponent(logModule));
        const lg = await lr.json();
        const empty =
          !lg.text ||
          lg.text.startsWith("（尚无") ||
          lg.text.startsWith("（尚无任何");
        const text = empty
          ? `【${lg.log_key || logModule}】还没有任务输出。\n` +
            `· 拉取远程 → git / all\n` +
            `· 重建/同步 → 对应模块；形如 [日期 时间] 日志`
          : lg.text;
        if (hideLogUntilChange !== null) {
          if (text === hideLogUntilChange) {
            updateClearBtn();
            return;
          }
          hideLogUntilChange = null;
        }
        if (text === lastLogText) return;
        lastLogText = text;
        $("log").textContent = text;
        const hint = $("log-meta-hint");
        if (hint) {
          hint.textContent = lg.newest_ts
            ? `最新一段：${lg.newest_ts} · ${lg.count || 0} 段`
            : "";
        }
        updateClearBtn();
      } catch (e) {
        $("log").textContent = String(e);
      }
    }

    function clearLog() {
      hideLogUntilChange = lastLogText || $("log").textContent || "";
      lastLogText = "";
      $("log").textContent = "";
      const hint = $("log-meta-hint");
      if (hint) hint.textContent = "已清空显示 · 有新输出时再出现";
      updateClearBtn();
    }

    function renderMode() {
      for (const b of $("mode-seg").querySelectorAll("button[data-mode]")) {
        b.classList.toggle("on", b.getAttribute("data-mode") === detectMode);
      }
      $("btn-pull").disabled = busy;
      const rem = plan?.git_remote || {};
      const hint = $("remote-hint");
      hint.textContent = rem.hint || "";
      hint.className = "remote-hint" + (rem.behind > 0 ? " warn" : "");
    }

    function renderHeader() {
      const pill = $("pill");
      const s = plan?.summary || "error";
      pill.className = "pill " + s;
      pill.textContent = s === "healthy" ? "全部最新" : "存在变动";
      busy = ["building", "switching", "verifying"].includes((plan?.deploy || {}).phase || "");
      renderMode();
    }

    async function refresh(force) {
      try {
        const q = new URLSearchParams({ mode: detectMode });
        if (force) q.set("force", "1");
        const r = await fetch("/api/plan?" + q.toString());
        const next = await r.json();
        if (!selectedId && next.items?.length) selectedId = next.items[0].id;
        const sig = planSig(next) + "|" + detectMode;
        const changed = sig !== lastPlanSig;
        plan = next;
        if (changed) {
          lastPlanSig = sig;
          renderHeader();
          renderList();
          renderDetail();
        } else {
          renderMode();
        }
        await loadLogMeta();
        await loadLog();
        const scope = plan.detect_scope ? ` · ${plan.detect_scope}` : "";
        const stale = plan.stale ? " · 后台核对中…" : "";
        const headBit = plan.git_sha_short
          ? ` · HEAD ${plan.git_sha_short}${plan.git_subject ? " " + plan.git_subject : ""}`
          : "";
        $("job").textContent =
          `任务 ${(plan.deploy || {}).phase || "idle"}${(plan.deploy || {}).message ? " · " + (plan.deploy || {}).message : ""}${headBit}${scope}${stale}`;
        if (plan.stale && !force) {
          if (staleTimer) clearTimeout(staleTimer);
          staleTimer = setTimeout(() => refresh(false), 2200);
        }
      } catch (e) {
        $("err").textContent = String(e);
      }
    }

    async function runAction(action) {
      $("err").textContent = "";
      busy = true;
      renderList();
      renderMode();
      try {
        const r = await fetch("/api/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          $("err").textContent = j.error || r.statusText;
          busy = false;
          renderList();
          renderMode();
          return;
        }
        $("job").textContent = `已启动 ${action}…`;
        const key = {
          "up-api": "api",
          "up-runtime": "runtime",
          "up-web": "web",
          "up-gateway": "gateway",
          "sync-sources": "index_product",
          "sync-ops-indexes": "index_ops",
          "git-pull": "all",
        }[action];
        if (key) {
          logModule = key;
          localStorage.setItem("releaseLogModule", logModule);
          lastLogText = "";
          hideLogUntilChange = null;
          renderLogTabs();
        }
        if (action === "git-pull") {
          detectMode = "sync";
          localStorage.setItem("releaseDetectMode", detectMode);
          renderMode();
        }
        setTimeout(() => refresh(true), action === "git-pull" ? 2500 : 1200);
      } catch (e) {
        $("err").textContent = String(e);
        busy = false;
        renderList();
        renderMode();
      }
    }

    $("mode-seg").onclick = (ev) => {
      const b = ev.target.closest("button[data-mode]");
      if (!b) return;
      const m = b.getAttribute("data-mode");
      if (m !== "local" && m !== "sync") return;
      if (m === detectMode) return;
      detectMode = m;
      localStorage.setItem("releaseDetectMode", detectMode);
      lastPlanSig = "";
      renderMode();
      refresh(true);
    };
    $("btn-pull").onclick = () => runAction("git-pull");
    $("btn-clear-log").onclick = () => clearLog();

    renderMode();
    refresh(false);
    setInterval(() => refresh(false), 8000);
  </script>
</body>
</html>
