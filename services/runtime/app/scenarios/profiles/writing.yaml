scenario_id: writing
display_name: 写作模式
system_prompt_template: scenarios/writing/system.md
tool_names:
  - read_file
  - list_dir
  - grep
  - glob
  - rename_file
  - propose_patch
  - draft_section
  - update_outline
  - update_plan
  - search_sources
  - check_citation
  - audit_knowledge_base
  - export_document
  - remember
  - recall
  - delegate
subagent_types:
  - researcher
  - drafter
  - editor
  - fact_checker
  - stylist
  - explore
  - retrieve
  - planner
max_steps: 40
approval_overrides: {}
workspace_layout: document
web_layout: writing-workbench
# Hide intel standing corpus from writing RAG (same index plane; filter only).
# Texture prior: 可引用细节 / 世界观 before 概要 / 主线剧情 (tools apply; no Engine branch).
retrieval:
  exclude_path_prefixes:
    - seed/intel
  section_title_prior: texture
generation:
  temperature: 0.8
patch_auto_apply: true
plan_suggest:
  threshold: 4
post_turn_jobs:
  - sources.index_sync
hooks:
  system_prompt_composer: writing_cards
  compact_bookmark: writing_focus
  post_turn: writing_continuity
