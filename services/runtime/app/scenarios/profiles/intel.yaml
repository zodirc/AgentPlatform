scenario_id: intel
display_name: 威胁情报
system_prompt_template: scenarios/intel/system.md
tool_names:
  - read_file
  - list_dir
  - grep
  - glob
  - propose_patch
  - draft_section
  - update_outline
  - update_plan
  - enrich_ioc
  - lookup_indicator
  - search_sources
  - check_citation
  - export_document
  - remember
  - recall
  - delegate
subagent_types:
  - researcher
  - fact_checker
  - retrieve
  - planner
max_steps: 40
approval_overrides: {}
workspace_layout: document
web_layout: writing-workbench
# Profile-driven retrieval (tools apply; Engine does not branch). Omit path_prefix → seed/intel.
retrieval:
  default_path_prefix: seed/intel
  exclude_path_prefixes: []
generation:
  temperature: 0.3
plan_suggest:
  threshold: 4
