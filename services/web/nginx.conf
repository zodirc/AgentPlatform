server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Model output must not auto-load remote images or open arbitrary connections.
    # Repeated in each location: nginx drops inherited add_header when a location sets its own.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";

    # Hashed Vite chunks must 404 when missing. Falling back to index.html
    # returns HTML as JS (200) → "Failed to fetch dynamically imported module".
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
