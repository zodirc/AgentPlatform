# Phase 0 — single compose entry (docs/03 §4.1)

# F5: json-file logs are unbounded by default; cap at 10m × 3 per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Product agent DB + default retrieval (RETRIEVAL_BACKEND=pgvector).
    # JSON file index remains a fallback when the extension/probe fails.
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ops Bench only — isolated pgvector so official eval never shares CPU/IO/locks
  # with the product agent database (docs: mature control-plane vs data-plane).
  # Profile "bench": omitted from CI/runtime-lite smoke (gate); enabled by default
  # via Makefile COMPOSE_PROFILES=bench for daily make up / make up-bench.
  bench-postgres:
    profiles: [bench]
    image: pgvector/pgvector:pg16
    container_name: agent-bench-postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${BENCH_POSTGRES_USER:-bench}
      POSTGRES_PASSWORD: ${BENCH_POSTGRES_PASSWORD:-bench}
      POSTGRES_DB: ${BENCH_POSTGRES_DB:-bench}
    volumes:
      - bench_pg_data:/var/lib/postgresql/data
      - ./init/pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BENCH_POSTGRES_USER:-bench} -d ${BENCH_POSTGRES_DB:-bench}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  runtime:
    image: agent-platform-runtime:default
    build:
      context: ..
      # Default deploy image includes baked sentence-transformers (docs/03).
      # Lightweight hash-only image: services/runtime/Dockerfile (CI / make eval-*).
      # target app = thin layer (docs/38); deps stage holds pip + ST bake.
      dockerfile: services/runtime/Dockerfile.retrieval
      target: app
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
        # China defaults in Dockerfiles; CI clears APT_MIRROR and points pip/npm
        # at public registries (scripts/proof_compose_env.sh) so GHA does not hang.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    container_name: agent-runtime
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      MODEL_MODE: ${MODEL_MODE:-live}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DATA_DIR: /data
      WORKSPACE_ROOT: /workspace
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-240}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-pgvector}
      INDEX_VIA_WORKER: ${INDEX_VIA_WORKER:-true}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_MODEL_DIR: ${EMBEDDING_MODEL_DIR:-/data/models}
      # all-MiniLM-L6-v2 → 384; override to 256 only with EMBEDDING_BACKEND=hash
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_PROGRESS_EVERY_FILES: ${EMBEDDING_PROGRESS_EVERY_FILES:-25}
      SOURCES_STARTUP_SYNC_ENABLED: ${SOURCES_STARTUP_SYNC_ENABLED:-true}
      SOURCES_STARTUP_SYNC_DELAY_SECONDS: ${SOURCES_STARTUP_SYNC_DELAY_SECONDS:-3}
      SOURCES_WATCH_ENABLED: ${SOURCES_WATCH_ENABLED:-true}
      SOURCES_WATCH_POLL_SECONDS: ${SOURCES_WATCH_POLL_SECONDS:-2}
      SOURCES_WATCH_DEBOUNCE_SECONDS: ${SOURCES_WATCH_DEBOUNCE_SECONDS:-1.5}
      # Standing seed corpus (repo); nested RO mounts — no copy into workspace.
      SEED_SOURCES_ROOT: ${SEED_SOURCES_ROOT:-/workspace/sources/seed/writing}
      SEED_INTEL_ROOT: ${SEED_INTEL_ROOT:-/workspace/sources/seed/intel}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_HOME: ${HF_HOME:-/data/models}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-true}
      RETRIEVAL_RERANK_CROSS_ENCODER: ${RETRIEVAL_RERANK_CROSS_ENCODER:-false}
      # RET-7: excerpt-cover promote (default off after N≥2 ablation; set true to re-enable)
      SEARCH_SOURCES_EXCERPT_PROMOTE: ${SEARCH_SOURCES_EXCERPT_PROMOTE:-false}
      STALL_THRESHOLD_SECONDS: ${STALL_THRESHOLD_SECONDS:-180}
      STALL_POLL_INTERVAL_SECONDS: ${STALL_POLL_INTERVAL_SECONDS:-30}
      STALL_AUTO_FAIL: ${STALL_AUTO_FAIL:-true}
      TURN_TOKEN_BUDGET: ${TURN_TOKEN_BUDGET:-0}
      CONTEXT_WINDOW_TOKENS: ${CONTEXT_WINDOW_TOKENS:-128000}
      RUNTIME_RUNNER_ID: ${RUNTIME_RUNNER_ID:-}
      # Review I2: stream delta batch window; 0 = per-event writes (rollback).
      EVENT_BATCH_WINDOW_SECONDS: ${EVENT_BATCH_WINDOW_SECONDS:-0.04}
    volumes:
      - agent_data:/data
      - ${WORKSPACE_HOST_PATH:-../workspace}:/workspace:rw,z
      # Product standing corpus (git): RO mount under sources/ so search_sources
      # indexes it without copying into the user sandbox (docs/15).
      - ${SEED_SOURCES_HOST_PATH:-../seed/sources/writing}:/workspace/sources/seed/writing:ro,z
      # Intel standing corpus (_demo + vendor); see seed/sources/intel/README.md.
      - ${SEED_INTEL_HOST_PATH:-../seed/sources/intel}:/workspace/sources/seed/intel:ro,z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Use /health/live so first-boot can finish before MODEL_API_KEY / Web provider is set.
      # /health/ready still means "model configured" for ops probes.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

  api:
    image: agent-platform-api:latest
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: app
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
    container_name: agent-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNTIME_URL: http://runtime:8001
      RUNTIME_URL_MAP: ${RUNTIME_URL_MAP:-}
      BENCH_URL: ${BENCH_URL:-http://bench:8002}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      END_USER_AUTH_ENABLED: ${END_USER_AUTH_ENABLED:-true}
      ADMIN_SESSION_BYPASS: ${ADMIN_SESSION_BYPASS:-true}
      END_USER_COOKIE_SECURE: ${END_USER_COOKIE_SECURE:-false}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_MODE: ${WORKER_MODE:-inline}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      OPS_TEST_SECRET: ${OPS_TEST_SECRET:-}
      # Backend-private golden scratch (shared agent_data with runtime); not under /workspace.
      OPS_EVAL_WORKSPACE_ROOT: ${OPS_EVAL_WORKSPACE_ROOT:-/data/ops-eval}
      OPS_EVAL_GOLDEN_DIR: /app/eval/golden
      OPS_EVAL_COMPOSE_FILE: /app/deploy/docker-compose.yml
      OPS_EVAL_COMPOSE_PROJECT_DIR: /app
      OPS_EVAL_REPO_MOUNT: /repo
      # Optional absolute host path; else api discovers via docker inspect of /repo.
      OPS_EVAL_REPO_HOST_PATH: ${OPS_EVAL_REPO_HOST_PATH:-}
      # Official benches: always the container volume path (do NOT interpolate host
      # BENCH_DATA_DIR — a host absolute path makes Ops re-download forever).
      BENCH_DATA_DIR: /data/ops-official/data
      BENCH_REPORTS_DIR: /data/ops-official/reports
      BENCH_PUBLISH: "0"
    volumes:
      # Shared with runtime so ops fixtures under /data/ops-eval are Turn-visible.
      - agent_data:/data
      - ${WORKSPACE_HOST_PATH:-../workspace}:/workspace:rw,z
      - ../eval/golden:/app/eval/golden:ro,z
      - ../deploy:/app/deploy:ro,z
      - ../.env:/app/.env:ro,z
      # Full checkout is read-only. Docker socket access for Ops CI evaluation
      # lives in compose/ops-eval.yml and is opt-in, never a production default.
      - ..:/repo:ro,z
      # Share host official-bench cache with Ops (skip re-download when already pulled).
      - ${HOST_BENCH_DATA_DIR:-../eval/official/.local-data}:/data/ops-official/data:rw,z
      - ${HOST_BENCH_REPORTS_DIR:-../eval/reports/official}:/data/ops-official/reports:rw,z
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_healthy
      # Optional: CI/runtime-lite smoke omits profile "bench"; Ops official needs it.
      bench:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 5

  # Ops Bench worker: official suites with ST + dedicated bench-postgres (pgvector).
  # Not the agent Turn path — keeps eval decoupled from runtime product DB.
  bench:
    profiles: [bench]
    image: agent-platform-bench:latest
    build:
      context: ..
      dockerfile: services/bench/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    container_name: agent-bench
    restart: unless-stopped
    logging: *default-logging
    # 6g: headroom for ST index peaks (FiQA-scale); hybrid search stays thread-pooled
    # so we do not size for ST×N process copies. Product runtime mem_limit unchanged.
    mem_limit: 6g
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      BENCH_DATA_DIR: /data/ops-official/data
      BENCH_REPORTS_DIR: /data/ops-official/reports
      # Dedicated DB — never the product agent-postgres.
      DATABASE_URL: ${BENCH_DATABASE_URL:-postgresql://bench:bench@bench-postgres:5432/bench}
      BENCH_DATABASE_URL: ${BENCH_DATABASE_URL:-postgresql://bench:bench@bench-postgres:5432/bench}
      # Default = product-like ANN; set BENCH_RETRIEVAL_BACKEND=json for file-index smoke.
      BENCH_RETRIEVAL_BACKEND: ${BENCH_RETRIEVAL_BACKEND:-pgvector}
      BENCH_RETRIEVAL_PG_SCHEMA: ${BENCH_RETRIEVAL_PG_SCHEMA:-retrieval_bench}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_MODEL_DIR: /app/models-baked
      HF_HOME: /data/models
      # MiniLM weights come from baked models-baked; allow Hub for LongBench/SWE pulls.
      TRANSFORMERS_OFFLINE: ${BENCH_TRANSFORMERS_OFFLINE:-1}
      HF_HUB_OFFLINE: ${BENCH_HF_HUB_OFFLINE:-0}
    volumes:
      - agent_data:/data
      - ..:/repo:ro,z
      - ${HOST_BENCH_DATA_DIR:-../eval/official/.local-data}:/data/ops-official/data:rw,z
      - ${HOST_BENCH_REPORTS_DIR:-../eval/reports/official}:/data/ops-official/reports:rw,z
    depends_on:
      bench-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  web:
    image: agent-platform-web:latest
    build:
      context: ..
      dockerfile: services/web/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    container_name: agent-web
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: caddy:2-alpine
    container_name: agent-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HOST_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  bench_pg_data:
  agent_data:
  caddy_data:
