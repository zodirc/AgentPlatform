# Phase 0 — single compose entry (docs/03 §4.1)

# F5: json-file logs are unbounded by default; cap at 10m × 3 per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Code≠deps: keep deps layers via tagged *:deps images (deps-anchor) + pinned bases.
# pull: false — Hub floating tags must not override pinned PYTHON_BASE digests.
# Do not put short image names in cache_from: Compose Bake treats them as Docker Hub
# library/* and wastes time on failed registry imports. BuildKit reuses layers from
# the local graph after deps-anchor / prior builds; :deps tags resist GC.
x-build-cache-api: &build-cache-api
  pull: false

x-build-cache-runtime: &build-cache-runtime
  pull: false

x-build-cache-web: &build-cache-web
  pull: false

x-build-cache-bench: &build-cache-bench
  pull: false

# Named contexts for multi-GB offline caches (excluded from main context via .dockerignore).
# Paths are relative to this compose file (deploy/).
x-build-contexts-runtime: &build-contexts-runtime
  model_bake_cache: ./model-bake-cache
  torch_wheel_cache: ./torch-wheel-cache
  ts_grammar_cache: ./ts-grammar-cache

x-build-contexts-lite: &build-contexts-lite
  ts_grammar_cache: ./ts-grammar-cache

x-build-contexts-bench: &build-contexts-bench
  model_bake_cache: ./model-bake-cache
  torch_wheel_cache: ./torch-wheel-cache

services:
  postgres:
    # Product agent DB + default retrieval (RETRIEVAL_BACKEND=pgvector).
    # JSON file index remains a fallback when the extension/probe fails.
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ops L1 vector plane — isolated pgvector so Official eval source_* never share
  # locks/IO with the product agent database (Schema A: works/sessions stay on
  # agent-postgres; L1 corpora under ops-l1/ index here).
  # Profile [bench] (O9): gated with the L0 bench worker so constrained hosts
  # can skip ~1g cgroup via `COMPOSE_PROFILES=` / omit bench. Start via
  # COMPOSE_PROFILES=bench or make up-bench / start-bench.
  bench-postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-bench-postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    profiles: [bench]
    environment:
      POSTGRES_USER: ${BENCH_POSTGRES_USER:-bench}
      POSTGRES_PASSWORD: ${BENCH_POSTGRES_PASSWORD:-bench}
      POSTGRES_DB: ${BENCH_POSTGRES_DB:-bench}
    volumes:
      - bench_pg_data:/var/lib/postgresql/data
      - ./init/pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BENCH_POSTGRES_USER:-bench} -d ${BENCH_POSTGRES_DB:-bench}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  runtime:
    image: agent-platform-runtime:default
    build:
      <<: *build-cache-runtime
      context: ..
      additional_contexts: *build-contexts-runtime
      # Default deploy image includes baked sentence-transformers (docs/03).
      # Lightweight hash-only image: services/runtime/Dockerfile (CI / make eval-*).
      # target app = thin layer (docs/38); deps stage holds pip + ST bake.
      dockerfile: services/runtime/Dockerfile.retrieval
      target: app
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
        # China defaults in Dockerfiles; CI clears APT_MIRROR and points pip/npm
        # at public registries (scripts/proof_compose_env.sh) so GHA does not hang.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
        # Empty → CPU torch. GPU hosts: resolve_embedding_profile sets cu128 (RTX 50xx).
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    container_name: agent-runtime
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Ops L1 vector plane (ops-l1 works → agent-bench-postgres). Prefer OPS_*;
      # BENCH_* kept as alias for older scripts.
      OPS_DATABASE_URL: ${OPS_DATABASE_URL:-postgresql://bench:bench@bench-postgres:5432/bench}
      BENCH_DATABASE_URL: ${BENCH_DATABASE_URL:-postgresql://bench:bench@bench-postgres:5432/bench}
      OPS_RETRIEVAL_PG_SCHEMA: ${OPS_RETRIEVAL_PG_SCHEMA:-retrieval_ops}
      OPS_RETRIEVAL_PG_SCHEMA_ZH: ${OPS_RETRIEVAL_PG_SCHEMA_ZH:-retrieval_ops_zh}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      MODEL_MODE: ${MODEL_MODE:-live}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MODEL_EGRESS_ENFORCE: ${MODEL_EGRESS_ENFORCE:-false}
      DATA_DIR: /data
      WORKSPACE_ROOT: /workspace
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-600}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-pgvector}
      INDEX_VIA_WORKER: ${INDEX_VIA_WORKER:-true}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
      EMBEDDING_MODEL_DIR: ${EMBEDDING_MODEL_DIR:-/data/models}
      # gte-small → 384; gte-large → 1024（make resolve-embedding 按 GPU 写入）
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      # auto|cpu|cuda — compose/gpu.auto.yml sets cuda when NVIDIA is detected.
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_PROGRESS_EVERY_FILES: ${EMBEDDING_PROGRESS_EVERY_FILES:-25}
      # 0 → model default; bge-m3 still auto-caps to 512 in code unless overridden.
      EMBEDDING_MAX_SEQ_LENGTH: ${EMBEDDING_MAX_SEQ_LENGTH:-0}
      # Embed-space stamp (bge-m3@512 → 13). Must match resolve_embedding / plan board.
      EMBEDDING_INDEX_VERSION: ${EMBEDDING_INDEX_VERSION:-0}
      SOURCES_STARTUP_SYNC_ENABLED: ${SOURCES_STARTUP_SYNC_ENABLED:-true}
      SOURCES_STARTUP_SYNC_DELAY_SECONDS: ${SOURCES_STARTUP_SYNC_DELAY_SECONDS:-3}
      SOURCES_WATCH_ENABLED: ${SOURCES_WATCH_ENABLED:-true}
      SOURCES_WATCH_POLL_SECONDS: ${SOURCES_WATCH_POLL_SECONDS:-2}
      SOURCES_WATCH_DEBOUNCE_SECONDS: ${SOURCES_WATCH_DEBOUNCE_SECONDS:-1.5}
      # Standing seed corpus (repo); nested RO mounts — no copy into workspace.
      SEED_SOURCES_ROOT: ${SEED_SOURCES_ROOT:-/workspace/sources/seed/writing}
      SEED_INTEL_ROOT: ${SEED_INTEL_ROOT:-/workspace/sources/seed/intel}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_HOME: ${HF_HOME:-/data/models}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-true}
      RETRIEVAL_RERANK_CROSS_ENCODER: ${RETRIEVAL_RERANK_CROSS_ENCODER:-false}
      # RET-7: excerpt-cover promote (default off after N≥2 ablation; set true to re-enable)
      SEARCH_SOURCES_EXCERPT_PROMOTE: ${SEARCH_SOURCES_EXCERPT_PROMOTE:-false}
      # RET-18: two-level doc boost (default on; set false for ablation free N≥2)
      RETRIEVAL_TWO_LEVEL_ENABLED: ${RETRIEVAL_TWO_LEVEL_ENABLED:-true}
      # P1② / P3 / P2 structural leverage (docs/topics/structural-leverage-proposals.md)
      RETRIEVAL_BM25_RESCORE_ENABLED: ${RETRIEVAL_BM25_RESCORE_ENABLED:-true}
      RETRIEVAL_TWO_LEVEL_DOC_TABLE: ${RETRIEVAL_TWO_LEVEL_DOC_TABLE:-true}
      EMBEDDING_TEXT_INCLUDE_METADATA: ${EMBEDDING_TEXT_INCLUDE_METADATA:-false}
      STALL_THRESHOLD_SECONDS: ${STALL_THRESHOLD_SECONDS:-180}
      STALL_POLL_INTERVAL_SECONDS: ${STALL_POLL_INTERVAL_SECONDS:-30}
      STALL_AUTO_FAIL: ${STALL_AUTO_FAIL:-true}
      TURN_TOKEN_BUDGET: ${TURN_TOKEN_BUDGET:-0}
      CONTEXT_WINDOW_TOKENS: ${CONTEXT_WINDOW_TOKENS:-128000}
      # At 128K → 30K; scales with resolved profile/window (256K → 60K).
      CONTEXT_OUTPUT_RESERVE_TOKENS: ${CONTEXT_OUTPUT_RESERVE_TOKENS:-30000}
      CONTEXT_OUTPUT_SCALE_REF_WINDOW_TOKENS: ${CONTEXT_OUTPUT_SCALE_REF_WINDOW_TOKENS:-128000}
      RUNTIME_RUNNER_ID: ${RUNTIME_RUNNER_ID:-}
      # Review I2: stream delta batch window; 0 = per-event writes (rollback).
      EVENT_BATCH_WINDOW_SECONDS: ${EVENT_BATCH_WINDOW_SECONDS:-0.04}
      # Agent structural lane budgets (capability is Profile-owned, not a feature flag).
      STRUCTURAL_PREWARM: ${STRUCTURAL_PREWARM:-true}
      STRUCTURAL_NAV_TIMEOUT_S: ${STRUCTURAL_NAV_TIMEOUT_S:-15}
      STRUCTURAL_DIAG_TIMEOUT_S: ${STRUCTURAL_DIAG_TIMEOUT_S:-60}
      STRUCTURAL_MAX_FILES_PER_CALL: ${STRUCTURAL_MAX_FILES_PER_CALL:-20}
      STRUCTURAL_MAX_REFS: ${STRUCTURAL_MAX_REFS:-80}
      STRUCTURAL_CHECKS_MAX_ISSUES: ${STRUCTURAL_CHECKS_MAX_ISSUES:-20}
      STRUCTURAL_CHECKS_TIMEOUT_S: ${STRUCTURAL_CHECKS_TIMEOUT_S:-30}
      STRUCTURAL_SPAN_CANDIDATES: ${STRUCTURAL_SPAN_CANDIDATES:-5}
      # A6: runtime enqueues jobs; agent-ast-indexer parses (inline=true only for emergency).
      WORKSPACE_AST_ENABLED: ${WORKSPACE_AST_ENABLED:-true}
      WORKSPACE_AST_INLINE: ${WORKSPACE_AST_INLINE:-false}
      # SWE-bench Lite answer-leak ban: ops_eval Turns get bwrap --unshare-net.
      OPS_EVAL_DENY_NETWORK: ${OPS_EVAL_DENY_NETWORK:-false}
    volumes:
      - agent_data:/data
      - ${WORKSPACE_HOST_PATH:-../workspace}:/workspace:rw,z
      # Product standing corpus (git): RO mount under sources/ so search_sources
      # indexes it without copying into the user sandbox (docs/15).
      - ${SEED_SOURCES_HOST_PATH:-../seed/sources/writing}:/workspace/sources/seed/writing:ro,z
      # Intel standing corpus (_demo + vendor); see seed/sources/intel/README.md.
      - ${SEED_INTEL_HOST_PATH:-../seed/sources/intel}:/workspace/sources/seed/intel:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      # bench-postgres is profile [bench] only (O9); product Turns use agent-postgres.
    healthcheck:
      # Use /health/live so first-boot can finish before MODEL_API_KEY / Web provider is set.
      # /health/ready still means "model configured" for ops probes.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

  # Agent workspace AST indexer (docs/core/architecture.md).
  # Same image as runtime; separate PID — never shares Turn / Jedi / model loop.
  # Claims work_ast_index_jobs via FOR UPDATE SKIP LOCKED.
  ast-indexer:
    image: agent-platform-runtime:default
    build:
      <<: *build-cache-runtime
      context: ..
      additional_contexts: *build-contexts-runtime
      dockerfile: services/runtime/Dockerfile.retrieval
      target: app
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    container_name: agent-ast-indexer
    restart: unless-stopped
    logging: *default-logging
    # Keep small on constrained hosts (≤8Gi); parse concurrency 1.
    mem_limit: ${AST_INDEXER_MEM_LIMIT:-768m}
    cpus: ${AST_INDEXER_CPUS:-1.0}
    command:
      [
        "python",
        "-m",
        "app.structural.workspace_index.worker",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATA_DIR: /data
      WORKSPACE_ROOT: /workspace
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKSPACE_AST_ENABLED: ${WORKSPACE_AST_ENABLED:-true}
      WORKSPACE_AST_INLINE: "false"
      WORKSPACE_AST_PARSE_CONCURRENCY: ${WORKSPACE_AST_PARSE_CONCURRENCY:-2}
      WORKSPACE_AST_EVAL_PARSE_CONCURRENCY: ${WORKSPACE_AST_EVAL_PARSE_CONCURRENCY:-2}
      # 0 = §7.2 dynamic clamp(f(n_files)); set >0 only to force a fixed wall clock.
      WORKSPACE_AST_EVAL_BUDGET_SECONDS: ${WORKSPACE_AST_EVAL_BUDGET_SECONDS:-0}
      WORKSPACE_AST_EVAL_BUDGET_MIN_SECONDS: ${WORKSPACE_AST_EVAL_BUDGET_MIN_SECONDS:-60}
      WORKSPACE_AST_EVAL_BUDGET_MAX_SECONDS: ${WORKSPACE_AST_EVAL_BUDGET_MAX_SECONDS:-900}
      WORKSPACE_AST_EVAL_BUDGET_SECONDS_PER_FILE: ${WORKSPACE_AST_EVAL_BUDGET_SECONDS_PER_FILE:-0.75}
      WORKSPACE_AST_EVAL_MAX_FILES: ${WORKSPACE_AST_EVAL_MAX_FILES:-4000}
      AST_INDEXER_POLL_SECONDS: ${AST_INDEXER_POLL_SECONDS:-0.5}
      AST_INDEXER_HEARTBEAT: /data/ast_indexer_heartbeat
      # Background file HB thread; compose health age window is 120s (see healthcheck).
      AST_INDEXER_HEARTBEAT_SECONDS: ${AST_INDEXER_HEARTBEAT_SECONDS:-10}
      # Indexer does not call models / embeddings.
      MODEL_MODE: stub
      RETRIEVAL_BACKEND: hash
      EMBEDDING_BACKEND: hash
    volumes:
      - agent_data:/data
      - ${WORKSPACE_HOST_PATH:-../workspace}:/workspace:rw,z
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_healthy
    # File HB is a daemon thread. Age window covers brief GIL stalls during
    # parse/snapshot; full-tree dirty must not rely on this (see light_scan fix).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import time,pathlib; p=pathlib.Path('/data/ast_indexer_heartbeat'); t=float(p.read_text()); assert time.time()-t < 120",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Build-only: tags deps stage so BuildKit GC does not drop pip/ST layers between
  # app-only rebuilds (docs/38 · docs/03 §5.1). Never started as a container.
  # Also the primary cache_from source for runtime/app builds.
  runtime-deps:
    profiles: [deps-anchor]
    image: agent-platform-runtime:deps
    build:
      <<: *build-cache-runtime
      context: ..
      additional_contexts: *build-contexts-runtime
      dockerfile: services/runtime/Dockerfile.retrieval
      target: deps
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}

  # Build-only: tags deps stage so BuildKit GC does not drop pip layers between
  # app-only rebuilds (docs/38 · docs/03 §5.1). Never started as a container.
  api-deps:
    profiles: [deps-anchor]
    image: agent-platform-api:deps
    build:
      <<: *build-cache-api
      context: ..
      dockerfile: services/api/Dockerfile
      target: deps
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}

  api:
    image: agent-platform-api:latest
    build:
      <<: *build-cache-api
      context: ..
      dockerfile: services/api/Dockerfile
      target: app
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
    container_name: agent-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNTIME_URL: http://runtime:8001
      RUNTIME_URL_MAP: ${RUNTIME_URL_MAP:-}
      BENCH_URL: ${BENCH_URL:-http://bench:8002}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      END_USER_AUTH_ENABLED: ${END_USER_AUTH_ENABLED:-true}
      ADMIN_SESSION_BYPASS: ${ADMIN_SESSION_BYPASS:-true}
      END_USER_COOKIE_SECURE: ${END_USER_COOKIE_SECURE:-false}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_MODE: ${WORKER_MODE:-inline}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/workspace}
      OPS_TEST_SECRET: ${OPS_TEST_SECRET:-}
      # Backend-private golden scratch (shared agent_data with runtime); not under /workspace.
      OPS_EVAL_WORKSPACE_ROOT: ${OPS_EVAL_WORKSPACE_ROOT:-/data/ops-eval}
      OPS_EVAL_GOLDEN_DIR: /app/eval/golden
      OPS_EVAL_COMPOSE_FILE: /app/deploy/docker-compose.yml
      OPS_EVAL_COMPOSE_PROJECT_DIR: /app
      OPS_EVAL_REPO_MOUNT: /repo
      # Optional absolute host path; else api discovers via docker inspect of /repo.
      OPS_EVAL_REPO_HOST_PATH: ${OPS_EVAL_REPO_HOST_PATH:-}
      # Official benches: always the container volume path (do NOT interpolate host
      # BENCH_DATA_DIR — a host absolute path makes Ops re-download forever).
      BENCH_DATA_DIR: /data/ops-official/data
      BENCH_REPORTS_DIR: /data/ops-official/reports
      BENCH_PUBLISH: "0"
    volumes:
      # Shared with runtime so ops fixtures under /data/ops-eval are Turn-visible.
      - agent_data:/data
      - ${WORKSPACE_HOST_PATH:-../workspace}:/workspace:rw,z
      - ../eval/golden:/app/eval/golden:ro,z
      - ../deploy:/app/deploy:ro,z
      - ../.env:/app/.env:ro,z
      # Full checkout is read-only. Docker socket access for Ops CI evaluation
      # lives in compose/ops-eval.yml and is opt-in, never a production default.
      - ..:/repo:ro,z
      # Share host official-bench cache with Ops (skip re-download when already pulled).
      - ${HOST_BENCH_DATA_DIR:-../eval/official/.local-data}:/data/ops-official/data:rw,z
      - ${HOST_BENCH_REPORTS_DIR:-../eval/reports/official}:/data/ops-official/reports:rw,z
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_healthy
      # Optional: CI/runtime-lite smoke omits profile "bench"; Ops official needs it.
      bench:
        condition: service_healthy
        required: false
    healthcheck:
      # Process up + DB reachable path uses /health/live for Docker; /health/ready
      # still probes runtime live for ops, but must not depend on a busy Turn loop.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 5

  # Ops Bench worker: official suites with ST + dedicated bench-postgres (pgvector).
  # Not the agent Turn path — keeps eval decoupled from runtime product DB.
  bench:
    profiles: [bench]
    image: agent-platform-bench:latest
    build:
      <<: *build-cache-bench
      context: ..
      additional_contexts: *build-contexts-bench
      dockerfile: services/bench/Dockerfile
      target: app
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
    container_name: agent-bench
    restart: unless-stopped
    logging: *default-logging
    # 6g: headroom for ST index peaks (FiQA-scale); hybrid search stays thread-pooled
    # so we do not size for ST×N process copies. Product runtime mem_limit unchanged.
    mem_limit: 6g
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      BENCH_DATA_DIR: /data/ops-official/data
      BENCH_REPORTS_DIR: /data/ops-official/reports
      # Dedicated DB — never the product agent-postgres.
      DATABASE_URL: ${BENCH_DATABASE_URL:-postgresql://bench:bench@bench-postgres:5432/bench}
      BENCH_DATABASE_URL: ${BENCH_DATABASE_URL:-postgresql://bench:bench@bench-postgres:5432/bench}
      # Default = product-like ANN; set BENCH_RETRIEVAL_BACKEND=json for file-index smoke.
      BENCH_RETRIEVAL_BACKEND: ${BENCH_RETRIEVAL_BACKEND:-pgvector}
      BENCH_RETRIEVAL_PG_SCHEMA: ${BENCH_RETRIEVAL_PG_SCHEMA:-retrieval_bench}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
      EMBEDDING_MODEL_DIR: /app/models-baked
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      HF_HOME: /data/models
      # GTE weights come from baked models-baked; allow Hub for LongBench/SWE pulls.
      TRANSFORMERS_OFFLINE: ${BENCH_TRANSFORMERS_OFFLINE:-1}
      HF_HUB_OFFLINE: ${BENCH_HF_HUB_OFFLINE:-0}
    volumes:
      - agent_data:/data
      - ..:/repo:ro,z
      - ${HOST_BENCH_DATA_DIR:-../eval/official/.local-data}:/data/ops-official/data:rw,z
      - ${HOST_BENCH_REPORTS_DIR:-../eval/reports/official}:/data/ops-official/reports:rw,z
    depends_on:
      bench-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  # Build-only: tags web deps (pnpm install) so BuildKit GC does not drop store layers.
  web-deps:
    profiles: [deps-anchor]
    image: agent-platform-web:deps
    build:
      <<: *build-cache-web
      context: ..
      dockerfile: services/web/Dockerfile
      target: deps
      args:
        NODE_BASE: ${NODE_BASE:-node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293}
        NGINX_BASE: ${NGINX_BASE:-nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}

  # Build-only: tags bench deps (pip + ST bake) — profile deps-anchor (not bench).
  bench-deps:
    profiles: [deps-anchor]
    image: agent-platform-bench:deps
    build:
      <<: *build-cache-bench
      context: ..
      additional_contexts: *build-contexts-bench
      dockerfile: services/bench/Dockerfile
      target: deps
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}

  web:
    image: agent-platform-web:latest
    build:
      <<: *build-cache-web
      context: ..
      dockerfile: services/web/Dockerfile
      args:
        NODE_BASE: ${NODE_BASE:-node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293}
        NGINX_BASE: ${NGINX_BASE:-nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    container_name: agent-web
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: caddy:2-alpine
    container_name: agent-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HOST_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  bench_pg_data:
  agent_data:
  caddy_data:
