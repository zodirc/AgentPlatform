# Lightweight runtime for CI / isolated golden eval (hash embedding, no torch).
# Uses a separate image tag so eval builds do not overwrite the daily ST image
# (agent-platform-runtime:default from docker-compose.yml).
services:
  runtime:
    image: agent-platform-runtime:lite
    build:
      pull: false
      context: ..
      additional_contexts:
        # Project dir is deploy/ when -f deploy/docker-compose.yml (Bake resolves
        # from that dir). Same as docker-compose.yml — not ../ from this overlay.
        ts_grammar_cache: ./ts-grammar-cache
      dockerfile: services/runtime/Dockerfile
      target: app
      args:
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
    environment:
      EMBEDDING_BACKEND: ${EVAL_EMBEDDING_BACKEND:-hash}
      EMBEDDING_DIMENSIONS: ${EVAL_EMBEDDING_DIMENSIONS:-256}
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
