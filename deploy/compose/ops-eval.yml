services:
  api:
    # Opt in only for local Ops Eval suites that invoke Docker on the host:
    # docker compose -f deploy/docker-compose.yml -f deploy/compose/ops-eval.yml …
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Solve-side run_tests reuses local sweb.eval (tar-sync into /testbed).
  # Product stack without this overlay keeps runtime docker-free.
  runtime:
    # Image defaults to USER app; sock is root:docker and app cannot talk to it.
    # Elevate only while this overlay is active (same idea as api USER root).
    user: "0:0"
    environment:
      # Board smoke results + release progress (host make / 看板预拉写入).
      RELEASE_STATUS_DIR: ${RELEASE_STATUS_DIR:-/data/release-status}
      BENCH_REPORTS_DIR: ${BENCH_REPORTS_DIR:-/data/ops-official/reports}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_RELEASE_STATUS_DIR:-../reports/release}:/data/release-status:ro,z
      - ${HOST_BENCH_REPORTS_DIR:-../eval/reports/official}:/data/ops-official/reports:ro,z
