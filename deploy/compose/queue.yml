# Optional queue profile: async outbox worker (ADR-010 Phase 2).
# Redis comes from deploy/compose/planes.yml (ADR-020).
# Usage: docker compose ... -f deploy/compose/planes.yml -f deploy/compose/queue.yml --profile queue up -d

services:
  api:
    profiles: [queue]
    environment:
      WORKER_MODE: outbox

  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
      target: app
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
    container_name: agent-worker
    profiles: [queue]
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUNTIME_URL: ${RUNTIME_URL:-http://runtime:8001}
      RUNTIME_URL_MAP: ${RUNTIME_URL_MAP:-}
      SOURCES_RETRIEVAL_URL: ${SOURCES_RETRIEVAL_URL:-http://sources-retrieval:8001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      runtime:
        condition: service_healthy
      sources-retrieval:
        condition: service_healthy
      redis:
        condition: service_healthy
