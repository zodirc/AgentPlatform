# Optional HA profile: dual runtime + pull dispatch (backend-scaling O1/O2 / WP9)
#
# Multi-tenancy (Work isolation) + multi-replica (concurrent Turns) are both
# required for a real multi-user web platform. Default `make up` stays single
# runtime for self-use; use this profile when concurrent Turns matter:
#
#   make up-ha
#
# `--scale runtime=0` disables the single `runtime` service from the base file.
# TURN_DISPATCH=pull: runtimes LISTEN/claim; no RUNTIME_URL_MAP round-robin.

x-runtime-env: &runtime-env
  DATABASE_URL: ${DATABASE_URL}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
  MODEL_MODE: ${MODEL_MODE:-live}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  MODEL_NAME: ${MODEL_NAME:-}
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  DATA_DIR: /data
  WORKSPACE_ROOT: /workspace
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-600}
  RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
  RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-pgvector}
  INDEX_VIA_WORKER: ${INDEX_VIA_WORKER:-true}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
  EMBEDDING_MODEL_DIR: ${EMBEDDING_MODEL_DIR:-/data/models}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
  SOURCES_STARTUP_SYNC_ENABLED: ${SOURCES_STARTUP_SYNC_ENABLED:-true}
  SOURCES_WATCH_ENABLED: ${SOURCES_WATCH_ENABLED:-true}
  SEED_SOURCES_ROOT: ${SEED_SOURCES_ROOT:-/workspace/sources/seed/writing}
  SEED_INTEL_ROOT: ${SEED_INTEL_ROOT:-/workspace/sources/seed/intel}
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
  HF_HOME: ${HF_HOME:-/data/models}
  STALL_THRESHOLD_SECONDS: ${STALL_THRESHOLD_SECONDS:-180}
  STALL_POLL_INTERVAL_SECONDS: ${STALL_POLL_INTERVAL_SECONDS:-30}
  STALL_AUTO_FAIL: ${STALL_AUTO_FAIL:-true}
  # Per-replica soft cap (docs/27 MT5b); total ≈ replicas × this.
  RUNTIME_MAX_INFLIGHT_TURNS: ${RUNTIME_MAX_INFLIGHT_TURNS:-16}
  TURN_DISPATCH: pull
  RUN_COMMANDS_CHANNEL_ENABLED: "true"

x-runtime-svc: &runtime-svc
  image: agent-platform-runtime:default
  restart: unless-stopped
  # F5: cap json-file logs (10m × 3) like the base compose file.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  mem_limit: 4g
  build:
    pull: false
    context: ..
    additional_contexts:
      # Bake resolves from project dir (deploy/) when merged with docker-compose.yml.
      model_bake_cache: ./model-bake-cache
      torch_wheel_cache: ./torch-wheel-cache
      ts_grammar_cache: ./ts-grammar-cache
    dockerfile: services/runtime/Dockerfile.retrieval
    target: app
    args:
      PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim@sha256:a630a63cdb314e2d138a2fca3e375e319e8568346ffafac5b980f888630ac4f1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-thenlper/gte-small}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
      APT_MIRROR: ${APT_MIRROR-mirrors.aliyun.com}
      TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-https://mirrors.aliyun.com/pytorch-wheels/cpu}
      TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
  volumes:
    # Shared across replicas — required for Work roots under /data/works/{id}
    - agent_data:/data
    - ${WORKSPACE_HOST_PATH:-../workspace}:/workspace:rw,z
    - ${SEED_SOURCES_HOST_PATH:-../seed/sources/writing}:/workspace/sources/seed/writing:ro,z
    - ${SEED_INTEL_HOST_PATH:-../seed/sources/intel}:/workspace/sources/seed/intel:ro,z
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health/live"]
    interval: 10s
    timeout: 5s
    start_period: 120s
    retries: 5

services:
  runtime-a:
    <<: *runtime-svc
    container_name: agent-runtime-a
    environment:
      <<: *runtime-env
      RUNTIME_RUNNER_ID: runtime-a

  runtime-b:
    <<: *runtime-svc
    container_name: agent-runtime-b
    environment:
      <<: *runtime-env
      RUNTIME_RUNNER_ID: runtime-b

  api:
    environment:
      # O1: claim-based dispatch (no RUNTIME_URL_MAP). Commands via run_commands.
      TURN_DISPATCH: pull
      RUN_COMMANDS_CHANNEL_ENABLED: "true"
      RUNTIME_URL: http://runtime-a:8001
    depends_on:
      runtime:
        required: false
      runtime-a:
        condition: service_healthy
      runtime-b:
        condition: service_healthy
