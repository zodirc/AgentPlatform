# Docker deps-stage pin only. Frozen [project].version on purpose:
# bumping python/pyproject.toml SemVer must not re-run pip / swebench / torch.
# When agent-contracts *pip dependencies* change, update this file (and the
# matching list in python/pyproject.toml). Hatchling still needs a stub
# package dir; Dockerfiles generate /tmp/contracts/agent_contracts/__init__.py.
[project]
name = "agent-contracts"
version = "0.1.0"
description = "Deps-layer stub; real sources overlay via PYTHONPATH=/contracts/python"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_contracts"]
