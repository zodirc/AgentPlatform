  <title>AgentPlatform · 控制流导览</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("agent.docs.theme");
        if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "ink";
        if (t) document.documentElement.setAttribute("data-theme", t);
        var z = parseInt(localStorage.getItem("agent.docs.zoom"), 10);
        if (z >= 90 && z <= 175) document.documentElement.style.fontSize = (16 * z / 100) + "px";
      } catch (e) {}
    })();
  </script>

    .swatch:hover { transform: scale(1.08); }
    .swatch[aria-pressed="true"] {

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
    }

      top: 0;
      z-index: 5;

      flex: 1;

      gap: 0.45rem;

      flex: 0 0 auto;

      background: var(--accent-soft);
      border-radius: 999px;

    .crumb-title {
      min-width: 0;

      white-space: nowrap;
      font-weight: 650;
      color: var(--ink);
    }
    .crumb-count {
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: var(--mono);
    }
    .topbar-actions { display: flex; align-items: center; gap: 0.5rem; }
    .type-scale {
      display: flex;
      align-items: center;
      gap: 0.15rem;
    }
    .pager { display: flex; gap: 0.4rem; }
    .pager button,
    .type-scale button,
    .nav-toggle {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 9px;
      padding: 0.4rem 0.8rem;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink);
    }
    .type-scale button {
      padding: 0.4rem 0.55rem;
      min-width: 2.1rem;
      font-family: var(--sans);
      letter-spacing: -0.04em;
    }
    .type-scale .zoom-label {
      min-width: 2.7rem;
      padding: 0.4rem 0.2rem;
      border: 0;
      background: transparent;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .pager button:hover:not(:disabled),
    .type-scale button:hover:not(:disabled),
    .nav-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .pager button:disabled,
    .type-scale button:disabled { opacity: 0.35; cursor: not-allowed; }
    .nav-toggle { display: none; }
    .read-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: transparent;
      pointer-events: none;

    .code-py .fn { color: #f0abfc; }
    .code-py .ty { color: #86efac; }

    ul, ol { margin: 0.4rem 0 0.2rem; padding-left: 1.2rem; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 960px) {
      body { grid-template-columns: 1fr; }
      .nav-toggle { display: inline-flex; }
      .crumb-group { display: none; }

      .nav-backdrop {
        display: none;

      .sidebar {
        position: fixed;

    }
    .figure {
      margin: 0.85rem 0 0.2rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: var(--shadow);

    .figure .diagram-body {

        radial-gradient(ellipse at top left, var(--accent-soft), transparent 48%),
        var(--figure-wash);
    }
    .figure .diagram-body.diagram-svg {
      padding: 0.65rem;

    }
    .figure .diagram-body.diagram-svg img {
      display: block;
      width: 100%;
      height: auto;
      max-height: none;
      border-radius: 8px;
      border: 1px solid var(--line);

    .figure .diagram-title {
      margin: 0 0 0.75rem;

    .figure.zoomed {

    .figure:not(.zoomed) .diagram-body { cursor: zoom-in; }
    .figure.zoomed figcaption {

    .flow {

    .flow-col {

    .fn .n {
      display: inline-flex;

    .diagram-legend .l-decision::before { background: var(--warn-soft); border-color: var(--warn); }

<body>
  <div class="nav-backdrop" id="navBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="https://github.com/zodirc/AgentPlatform" title="打开 GitHub 主仓库">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-copy">
          <h1>AgentPlatform</h1>
          <p>控制流导览 · GitHub ↗</p>
        </span>
      </a>
      <label class="nav-search">
        <input id="navFilter" type="search" placeholder="筛选章节" autocomplete="off" />
        <kbd>/</kbd>
      </label>
    </div>
    <nav class="nav" id="nav" aria-label="章节"></nav>
    <div class="sidebar-foot">
      <div class="theme-bar" id="themeBar" role="group" aria-label="外观主题"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" class="nav-toggle" id="navToggle" aria-label="打开目录">目录</button>
      <div class="crumb" id="pageMeta">
        <span class="crumb-group" id="pageGroup">—</span>
        <span class="crumb-title" id="pageTitle">—</span>
        <span class="crumb-count" id="pageCount"></span>
      </div>
      <div class="topbar-actions">
        <div class="type-scale" role="group" aria-label="正文字号">
          <button type="button" id="zoomOut" title="缩小字号（-）" aria-label="缩小字号">A−</button>
          <button type="button" class="zoom-label" id="zoomLabel" title="恢复默认字号（0）" aria-label="当前字号，点击恢复默认">100%</button>
          <button type="button" id="zoomIn" title="放大字号（+）" aria-label="放大字号">A+</button>
        </div>
        <div class="pager">
          <button type="button" id="prevBtn">上一页</button>
          <button type="button" id="nextBtn">下一页</button>
        </div>
      </div>
      <div class="read-progress" aria-hidden="true"><i id="readProgress"></i></div>
    </header>
    <main class="content" id="content">
      <p class="lede" id="tourLoadMsg">载入章节… 若长时间无内容，请用 <code>make docs-tour</code> 以 HTTP 打开（不要用 file://）。</p>
    </main>
  </div>

  <script>
    (async function () {
      const blurbs = {
        cover: "边界、权威与读法",
        principles: "R1–R5 热路径验收",
        topology: "Caddy · api · runtime",
        backend: "pull 时序 · 三道闸 · 双池",
        domain: "Work / Session / Turn / Run",
        "request-path": "受理 → 领取 → 投影",
        "start-turn": "202 与 turn.accepted",
        "runtime-layers": "Controller 与 Engine",
        "engine-loop": "assemble → model → tools",
        approval: "审批门与同 run_id 续跑",
        "turn-state": "checkpoint 须恢复的义务",
        scenarios: "Profile 注入，禁止 if scenario",
        tools: "结果契约与 handler 改道",
        context: "卫生与 0.80 / 0.90 / 0.95",
        sandbox: "审批门 · 沙箱门 · 解题改道",
        "coding-fuse": "定义、波及、验证回灌",
        verify: "verify_receipt 旁路 continue",
        "issue-repro": "issue 例子覆盖义务",
        "related-tests": "失败摘要与相关测试命令",
        events: "NOTIFY / LISTEN / SSE / view",
        contracts: "packages/contracts",
        rag: "search_sources hybrid",
        "rag-deep-dive": "图编号逐步对照代码",
        index: "INDEX 13 · 450 / 64",
        writing: "Work 树 · 薄纲 · occupy=fresh",
        "writing-signals": "L0 过程门 · L1 类原型",
        "ops-bench": "L1 agent-path，不是 CI",
        "ops-eval-why": "官方题面、可见范围、命中",
        "ops-eval-walk": "本地实例：qrels / Answer: / F2P",
        scorecard: "第4轮完整 smoke 回放",
        "ops-eval-retrieval": "BEIR：搜到 qrels 才算命中",
        "ops-eval-context": "LongBench：抽 Answer: 后 F1/EM",
        "ops-eval-coding": "SWE：harness F2P∧P2P 才通过",
        "ci-proof": "合入门禁，不是效果分",
        next: "对照刚才那次跑的缺口",
      };

      const PAGE_FILES = [
        "cover", "principles", "topology", "backend",
        "domain", "request-path", "start-turn",
        "runtime-layers", "engine-loop", "approval", "turn-state",
        "scenarios", "tools", "context", "sandbox",
        "coding-fuse", "verify", "issue-repro", "related-tests",
        "events", "contracts",
        "rag", "rag-deep-dive", "index", "writing", "writing-signals",
        "ops-bench", "ops-eval-why", "ops-eval-walk", "scorecard",
        "ops-eval-retrieval", "ops-eval-context", "ops-eval-coding",
        "ci-proof", "next",
      ];

      const nav = document.getElementById("nav");
      const pageGroup = document.getElementById("pageGroup");
      const pageTitle = document.getElementById("pageTitle");
      const pageCount = document.getElementById("pageCount");
      const readProgress = document.getElementById("readProgress");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const filter = document.getElementById("navFilter");
      const content = document.getElementById("content");
      const navToggle = document.getElementById("navToggle");
      const navBackdrop = document.getElementById("navBackdrop");
      const themeBar = document.getElementById("themeBar");
      const zoomOut = document.getElementById("zoomOut");
      const zoomIn = document.getElementById("zoomIn");
      const zoomLabel = document.getElementById("zoomLabel");

      const loadMsg = document.getElementById("tourLoadMsg");
      try {
        const htmls = await Promise.all(PAGE_FILES.map(async (id) => {
          const r = await fetch("pages/" + id + ".html");
          if (!r.ok) throw new Error(id + " HTTP " + r.status);
          return r.text();
        }));
        content.innerHTML = htmls.join("\n");
      } catch (err) {
        if (loadMsg) {
          loadMsg.textContent = "导览章节未能载入：" + err + "。请用 make docs-tour 打开。";
        }
        return;
      }
      const pages = Array.from(document.querySelectorAll(".page"));
      let idx = 0;
      const warmed = new Set();

      const THEMES = [
        { id: "paper", label: "纸色", swBg: "#e8edf2", swAccent: "#0f766e" },
        { id: "mist", label: "雾色", swBg: "#e4e9ef", swAccent: "#3d5a80" },
        { id: "ink", label: "墨色", swBg: "#12161e", swAccent: "#2dd4bf" },
        { id: "ocean", label: "海色", swBg: "#0e1822", swAccent: "#5ba3d0" },
        { id: "contrast", label: "高对比", swBg: "#0a0a0a", swAccent: "#e8b923" },
      ];
      const THEME_KEY = "agent.docs.theme";

      function readTheme() {
        try {
          const raw = localStorage.getItem(THEME_KEY);
          if (THEMES.some((t) => t.id === raw)) return raw;
        } catch (e) {}
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "ink";
        }
        return "paper";
      }

      function applyTheme(id) {
        const t = THEMES.find((x) => x.id === id) || THEMES[0];
        document.documentElement.setAttribute("data-theme", t.id);
        try { localStorage.setItem(THEME_KEY, t.id); } catch (e) {}
        themeBar.querySelectorAll("[data-theme-id]").forEach((btn) => {
          btn.setAttribute("aria-pressed", btn.dataset.themeId === t.id ? "true" : "false");
        });
      }

      (function mountThemes() {
        const lab = document.createElement("span");
        lab.className = "theme-label";
        lab.textContent = "外观";
        lab.title = "按 t 循环主题";
        themeBar.appendChild(lab);
        THEMES.forEach((t) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "swatch";
          b.dataset.themeId = t.id;
          b.title = t.label;
          b.setAttribute("aria-label", t.label);
          b.style.setProperty("--sw-bg", t.swBg);
          b.style.setProperty("--sw-accent", t.swAccent);
          b.addEventListener("click", () => applyTheme(t.id));
          themeBar.appendChild(b);
        });
        applyTheme(readTheme());
      })();

      const ZOOM_KEY = "agent.docs.zoom";
      const ZOOM_STEPS = [90, 100, 115, 130, 150, 175];
      let zoomPct = 100;

      function readZoom() {
        try {
          const n = parseInt(localStorage.getItem(ZOOM_KEY), 10);
          if (ZOOM_STEPS.indexOf(n) !== -1) return n;
        } catch (e) {}
        return 100;
      }

      function applyZoom(pct) {
        const nearest = ZOOM_STEPS.reduce((best, s) =>
          Math.abs(s - pct) < Math.abs(best - pct) ? s : best, ZOOM_STEPS[0]);
        zoomPct = nearest;
        document.documentElement.style.fontSize = (16 * zoomPct / 100) + "px";
        try { localStorage.setItem(ZOOM_KEY, String(zoomPct)); } catch (e) {}
        zoomLabel.textContent = zoomPct + "%";
        zoomOut.disabled = zoomPct <= ZOOM_STEPS[0];
        zoomIn.disabled = zoomPct >= ZOOM_STEPS[ZOOM_STEPS.length - 1];
      }

      function bumpZoom(dir) {
        const i = ZOOM_STEPS.indexOf(zoomPct);
        const next = ZOOM_STEPS[Math.max(0, Math.min(ZOOM_STEPS.length - 1, i + dir))];
        applyZoom(next);
      }

      zoomOut.addEventListener("click", () => bumpZoom(-1));
      zoomIn.addEventListener("click", () => bumpZoom(1));
      zoomLabel.addEventListener("click", () => applyZoom(100));
      applyZoom(readZoom());

      function setNavOpen(open) {
        document.body.classList.toggle("nav-open", open);
      }

      pages.forEach((p) => {
        p.querySelectorAll("img").forEach((img) => {
          const src = img.getAttribute("src");
          if (src) {
            img.dataset.src = src;
            img.removeAttribute("src");
          }
          img.decoding = "async";
          img.width = img.width || 1536;
          img.height = img.height || 1024;
        });
      });

      const groups = [];
      pages.forEach((p, i) => {
        const g = p.dataset.group || "其他";
        if (!groups.length || groups[groups.length - 1].name !== g) {
          groups.push({ name: g, items: [] });
        }
        groups[groups.length - 1].items.push({
          el: p,
          i,
          id: p.dataset.id,
          title: p.dataset.title || p.dataset.id,
          blurb: blurbs[p.dataset.id] || "",
        });
      });

      groups.forEach((g) => {
        const wrap = document.createElement("div");
        wrap.className = "nav-group";
        const t = document.createElement("button");
        t.type = "button";
        t.className = "nav-group-title";
        t.innerHTML = `<span class="nav-group-name"></span><span class="nav-group-meta"><span class="nav-group-count">${g.items.length}</span><span class="chev">▸</span></span>`;
        t.querySelector(".nav-group-name").textContent = g.name;
        t.addEventListener("click", () => wrap.classList.toggle("is-collapsed"));
        wrap.appendChild(t);
        g.items.forEach((item) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "nav-item";
          b.title = item.blurb;
          b.dataset.hay = (item.title + " " + item.blurb + " " + g.name).toLowerCase();
          b.innerHTML =
            `<span class="num">${String(item.i).padStart(2, "0")}</span>` +
            `<span class="nav-text"><span class="nav-title"></span><span class="nav-blurb"></span></span>`;
          b.querySelector(".nav-title").textContent = item.title;
          b.querySelector(".nav-blurb").textContent = item.blurb;
          b.addEventListener("click", () => {
            go(item.i);
            setNavOpen(false);
          });
          item.btn = b;
          wrap.appendChild(b);
        });
        g.wrap = wrap;
        nav.appendChild(wrap);
      });

      function warmImages(i) {
        const p = pages[i];
        if (!p) return;
        p.querySelectorAll("img").forEach((img) => {
          const src = img.dataset.src;
          if (!src || img.getAttribute("src") === src) return;
          img.src = src;
        });
        warmed.add(i);
      }

      function go(n) {
        idx = Math.max(0, Math.min(pages.length - 1, n));
        warmImages(idx);
        warmImages(idx + 1);
        warmImages(idx - 1);
        pages.forEach((p, i) => p.classList.toggle("active", i === idx));
        groups.forEach((g) => {
          const here = g.items.some((item) => item.i === idx);
          if (here) g.wrap.classList.remove("is-collapsed");
          g.items.forEach((item) => {
            const on = item.i === idx;
            item.btn.classList.toggle("active", on);
            item.btn.setAttribute("aria-current", on ? "page" : "false");
          });
        });
        const p = pages[idx];
        pageGroup.textContent = p.dataset.group || "";
        pageTitle.textContent = p.dataset.title || "";
        pageCount.textContent = `${idx + 1} / ${pages.length}`;
        readProgress.style.width = `${((idx + 1) / pages.length) * 100}%`;
        prevBtn.disabled = idx === 0;
        nextBtn.disabled = idx === pages.length - 1;
        history.replaceState(null, "", `#${p.dataset.id}`);
        const activeBtn = nav.querySelector("button.nav-item.active");
        if (activeBtn) {
          const navRect = nav.getBoundingClientRect();
          const btnRect = activeBtn.getBoundingClientRect();
          if (btnRect.top < navRect.top || btnRect.bottom > navRect.bottom) {
            nav.scrollTop += btnRect.top - navRect.top - navRect.height / 2 + btnRect.height / 2;
          }
        }
        content.scrollTop = 0;
      }

      function applyFilter() {
        const q = (filter.value || "").trim().toLowerCase();
        groups.forEach((g) => {
          let visible = 0;
          g.items.forEach((item) => {
            const show = !q || item.btn.dataset.hay.indexOf(q) !== -1;
            item.btn.hidden = !show;
            if (show) visible += 1;
          });
          g.wrap.classList.toggle("is-empty", visible === 0);
          if (q && visible) g.wrap.classList.remove("is-collapsed");
        });
      }

      filter.addEventListener("input", applyFilter);
      prevBtn.addEventListener("click", () => go(idx - 1));
      nextBtn.addEventListener("click", () => go(idx + 1));
      navToggle.addEventListener("click", () => setNavOpen(!document.body.classList.contains("nav-open")));
      navBackdrop.addEventListener("click", () => setNavOpen(false));
      window.addEventListener("keydown", (e) => {
        const typing = e.target === filter || (e.target && e.target.tagName === "INPUT");
        if (e.key === "Escape") {
          document.querySelectorAll(".figure.zoomed").forEach((f) => f.classList.remove("zoomed"));
          setNavOpen(false);
          if (filter.value) {
            filter.value = "";
            applyFilter();
          }
          filter.blur();
          return;
        }
        if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === "ArrowLeft" || e.key === "k") go(idx - 1);
        if (e.key === "ArrowRight" || e.key === "j") go(idx + 1);
        if (e.key.toLowerCase() === "t") {
          const cur = document.documentElement.getAttribute("data-theme") || "paper";
          const i = THEMES.findIndex((x) => x.id === cur);
          applyTheme(THEMES[(i + 1 + THEMES.length) % THEMES.length].id);
        }
        if (e.key === "-" || e.key === "_") bumpZoom(-1);
        if (e.key === "=" || e.key === "+") bumpZoom(1);
        if (e.key === "0") applyZoom(100);
        if (e.key === "/") {
          e.preventDefault();
          filter.focus();
        }
      });

      document.querySelectorAll(".figure").forEach((fig) => {
        fig.addEventListener("click", () => {
          const sel = window.getSelection && window.getSelection();
          if (sel && String(sel).length) return;
          fig.classList.toggle("zoomed");
        });
      });

      const hash = location.hash.replace(/^#/, "");
      const start = Math.max(0, pages.findIndex((p) => p.dataset.id === hash));
      go(start === -1 ? 0 : start);

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("../sw.js").catch(() => {});
      }
    })();
  </script>
</body>
</html>
