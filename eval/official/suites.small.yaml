# Official small suites — data is pulled into BENCH_DATA_DIR (not committed).
# Protocol versions are pinned; bump deliberately when changing pulls or metrics.

# L0 component benches (beir_run / context_run / swe_run bypass path).
protocol_version_l0: "official-small-2026-08-m1"
# L1 agent-path manifests stamp this via official_agent_path.PROTOCOL_L1.
protocol_version_l1: "official-small-2026-08-m3"
# Legacy alias for older L0 loaders (same as protocol_version_l0).
protocol_version: "official-small-2026-08-m1"

data_dir_env: BENCH_DATA_DIR
default_data_dir: ~/.cache/agentplatform-bench

suites:
  retrieval:
    id: beir.small
    official: BEIR
    # https://github.com/beir-cellar/beir/wiki/Datasets-available
    datasets:
      # approx_mib = zip size (UI/plan only; not a gate)
      - name: scifact
        url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip
        md5: 5f7d1de60b170fc8027bb7898e2efca1
        approx_mib: 2.7
      - name: nfcorpus
        url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/nfcorpus.zip
        md5: a89dba18a62ef92f7d323ec890a0d38d
        approx_mib: 2.3
      - name: fiqa
        url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/fiqa.zip
        md5: 17918ed23cd04fb15047f73e6c3bd9d9
        approx_mib: 17.1
    split: test
    metrics: [ndcg_at_10, recall_at_100, map_at_100]
    # Default effect score = platform hybrid (BM25∥vector→RRF). BM25 is the floor control.
    primary_arm: hybrid
    arms: [hybrid, bm25]
    retriever: hybrid
    k_values: [1, 10, 100]

  # Chinese IR thermometer (PROD-2). Separate suite / macros / HNSW from BEIR.
  # Same runtime embedder as BEIR (GPU bge-m3); only schema graph differs.
  # Materialize under BENCH_DATA_DIR/cmteb/; L1 indexes ops-l1/cmteb-index → retrieval_ops_zh.
  # Full HF corpora are ~100k docs each; we cap to ~50k total (gold qrels kept + distractors).
  retrieval_zh:
    id: cmteb.small
    official: C-MTEB
    max_corpus_docs_total: 50000
    corpus_sample_seed: 42
    # HuggingFace: prefer mteb/* (includes qrels). C-MTEB/* often has corpus+queries only.
    datasets:
      - name: CovidRetrieval
        hf_dataset: mteb/CovidRetrieval
        approx_mib: 20
      - name: MedicalRetrieval
        hf_dataset: mteb/MedicalRetrieval
        approx_mib: 15
      - name: EcomRetrieval
        hf_dataset: mteb/EcomRetrieval
        approx_mib: 8
    split: test
    metrics: [ndcg_at_10, recall_at_100, map_at_100]
    primary_arm: hybrid
    arms: [hybrid, bm25]
    retriever: hybrid
    k_values: [1, 10, 100]
    sample_policy:
      method: head_slice
      limit_queries_per_dataset: 20
    protocol_note: "cmteb-small-v0 · shared bge-m3 · ~50k docs total · HNSW retrieval_ops_zh"

  context:
    id: longbench.small
    official: LongBench
    # Primary pull: official data.zip (datasets≥4 rejects THUDM loader scripts).
    # Fallback: hf_dataset / hf_dataset_parquet via `datasets`.
    hf_dataset: THUDM/LongBench
    hf_dataset_parquet: GinkgoQ/LongBench
    hf_data_zip: https://huggingface.co/datasets/THUDM/LongBench/resolve/main/data.zip
    hf_revision: main
    tasks:
      - multifieldqa_en
      - hotpotqa
      - narrativeqa
    max_samples_per_task: 40
    max_context_chars: 120000
    # Arms: full context vs middle-truncation vs ContextEngine compact.
    budget_chars: 24000
    metrics: [exact_match, retention_vs_full]
    judge: substring_or_f1

  coding:
    id: swebench.lite
    official: SWE-bench Lite
    hf_dataset: princeton-nlp/SWE-bench_Lite
    hf_revision: main
    split: test
    # Legacy cap; tiered selection is controlled by --tier / --n-instances.
    max_instances: 0
    predictions_filename: predictions.jsonl
    # Tiers n3/n5/n10/n25 use canonical HF-test-order slices; full300 is all IDs.
    # Official resolve scoring requires Docker + swebench.harness (see README).
    evaluate_with: swebench.harness.run_evaluation
    # E1 (docs/plan/agent-workspace-ast-index.md §7): eval-ephemeral AST index after
    # checkout (memory-only, never blocks StartTurn). Default on — product-parity arm.
    # Set false only for explicit index-off baseline dual-track.
    workspace_index: true
    # Official sweb.eval images (~1.0–1.2 GiB compressed / instance). Not in git.
    # Pre-pull via 部署看板「SWE eval 镜像」or: make official-bench-coding-pull-images
    harness:
      # Keep instance images after grading (harness default cache_level=env deletes them).
      cache_level: instance
      clean: false
      namespace: swebench
      image_tag: latest
      max_workers: 1
      # Board / make default readiness tier (n5 ≈ 5–6 GiB download).
      board_tier: n5
      # Fail-fast when images missing (avoid Evaluation 0/5 hang on bad Docker Hub).
      # Override: SWE_HARNESS_REQUIRE_LOCAL_IMAGES=0
      require_local_images: true
      # approx compressed size per instance (UI / plan hint only)
      approx_mib_per_image: 1100
      # Constrained hosts (≤8Gi / 6CPU): keep harness workers at 1; override via SWE_MAX_WORKERS.
