# F7 (docs/35): secret-scan gate configuration.
# Test fixtures with fake keys are marked inline with `gitleaks:allow`.

[extend]
useDefault = true

[allowlist]
paths = [
    # Local-only files never present in CI checkout, but excluded so
    # `gitleaks dir .` also passes on developer machines.
    '''^\.env''',
    '''__pycache__/''',
    '''node_modules/''',
    '''\.venv/''',
    '''deploy/backups/''',
]
